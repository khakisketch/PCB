/* ═══════════════════════════════════════════════════════════════════════════
   5. [메뉴 1] 대시보드 — 제조 품질(PCB QA / AOI) 개요 대시보드
   ═══════════════════════════════════════════════════════════════════════════ */
/**
 * 시간대별 검사 건수 누적 막대 차트(SVG)를 생성한다.
 * @returns {string} SVG 마크업
 */
function hourlyChart() {
  const hours = Array.from({ length: 12 }, (_, i) => 8 + i);
  const data = hours.map(h => { const rs = S.inspections.filter(r => new Date(r.at).getHours() === h); return { h, n: rs.filter(r => r.final === 'NORMAL').length, d: rs.filter(r => r.final === 'DEFECT').length, p: rs.filter(r => r.final === null).length }; });
  const max = Math.max(1, ...data.map(x => x.n + x.d + x.p)), W = 560, H = 200, bw = 28, gap = (W - 36 - bw * 12) / 11;
  const activeHours = data.filter(x => x.n + x.d + x.p > 0).map(x => x.h);
  const curH = activeHours.length ? Math.max(...activeHours) : -1;
  const grid = [0.25, 0.5, 0.75, 1].map(f => `<line x1="12" x2="${W - 12}" y1="${H - 26 - f * (H - 48)}" y2="${H - 26 - f * (H - 48)}" stroke="var(--border)" stroke-dasharray="3 4"/>`).join('');
  const bars = data.map((x, i) => {
    const X = 18 + i * (bw + gap); let y = H - 26; let out = '';
    [['n', 'var(--bar-normal)'], ['d', 'var(--bar-defect)'], ['p', 'var(--bar-pending)']].forEach(([k, c]) => {
      const h = x[k] / max * (H - 48); if (h > 0) { y -= h; out += `<rect class="bar" style="animation-delay:${i * 45}ms" x="${X}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${c}"/>`; }
    });
    const tot = x.n + x.d + x.p;
    return `<g class="hr" role="button" aria-label="${x.h}시 ${tot}건, 누르면 검사 이력으로 이동" data-tip="${x.h}시 · 정상 ${x.n} · 불량 ${x.d} · 대기 ${x.p} (합계 ${tot}) — 클릭: 이력 보기" onclick="gotoHour(${x.h})">` + out + `<text class="ct" x="${X + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="${x.h === curH ? 'var(--primary)' : 'var(--text-3)'}" font-weight="${x.h === curH ? 700 : 500}">${x.h}시</text><text class="bar-l ct" x="${X + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="10.5" fill="var(--text-2)">${tot || ''}</text><rect class="hit" x="${X - gap / 2}" y="0" width="${bw + gap}" height="${H - 18}"/></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="시간대별 검사 건수">${grid}${bars}</svg>
    <div class="chart-legend"><span><i class="swatch" style="background:var(--bar-normal)"></i>정상</span><span><i class="swatch" style="background:var(--bar-defect)"></i>불량 확정</span><span><i class="swatch" style="background:var(--bar-pending)"></i>검토 대기</span><span class="muted" style="margin-left:auto">막대 클릭 → 해당 시간대 이력</span></div>${chartTable(['시간', '정상', '불량', '검토 대기', '합계'], data.map(x => [x.h + '시', x.n, x.d, x.p, x.n + x.d + x.p]))}`;
}

/** 불량 검토 작업대(검사 관리 이관) 공용 도우미 — 현재 선택 건, 의심 위치 점, 심각도, 점 선택, 확대/축소 */
function dbCurrent() {
  let cur = S.inspections.find(r => r.n === (U.rvSel ?? U.dbSel));
  if (!cur) { cur = S.inspections.filter(r => r.final === null).sort((a, b) => b.n - a.n)[0] || [...S.inspections].sort((a, b) => b.n - a.n)[0]; U.rvSel = cur ? cur.n : null; }
  return cur;
}
/** 이상 의심 위치(이미지 기준 %) 목록. 데이터셋 정답 상자가 있으면 그 중심, 없으면 시연용 위치. */
function dbPoints(r) {
  if (!r || r.ai !== 'ANOMALY') return [];
  const bs = r.boxes && r.boxes.length ? r.boxes : (r.spot ? [{ x: r.spot.x - r.spot.r, y: r.spot.y - r.spot.r, w: r.spot.r * 2, h: r.spot.r * 2 }] : []);
  return bs.map(q => ({ x: Math.max(4, Math.min(96, q.x + q.w / 2)), y: Math.max(4, Math.min(96, q.y + q.h / 2)), k: q.k ? (KIND_KO[q.k] || q.k) : '의심 영역' }));
}
/** 심각도(점 색, 이름) — AI 점수 기준의 시연용 구분. */
function dbSeverity(r) { return r.ai !== 'ANOMALY' ? ['var(--good)', '정상 범위'] : r.score >= 0.8 ? ['#e5484d', '치명적'] : r.score >= 0.7 ? ['#f08a24', '높음'] : ['#f0ad38', '주의']; }
/** 검사를 선택해 검사 관리 화면으로 이동한다. @param {number} n 검사 번호 */
function dbPick(n) { openReview(n); }
/** 의심 위치 목록에서 하나를 고른다. @param {number} i 위치 순번 */
function dbDef(i) { U.dbDef = i; render(); }
/** 이미지 확대·축소(1~2.5배). @param {number} d 증감 */
function dbZoom(d) { U.dbZ = Math.max(1, Math.min(2.5, +((U.dbZ || 1) + d).toFixed(2))); render(); }
/** 이미지 확대 배율을 100%로 되돌린다. */
function dbZoomReset() { U.dbZ = 1; render(); }
/** 최종 판정을 저장하고 다음 검토 대기 건으로 넘어간다. */
function dbConfirm(n, d) { U.dbDef = 0; U.dbZ = 1; submitReview(n, d); }

/** 대시보드 기간 칩 전환 (오늘 / 7일 / 30일). */
function setDashPeriod(p) { U.dashPeriod = p; if (p !== 'today') U.dashChartMode = 'daily'; render(); }
/** 대시보드 오늘 추이 차트 보기 전환 (일별 / 시간대별). */
function setDashChartMode(m) { U.dashChartMode = m; render(); }

/**
 * 과거 일자 합성 이력 [검사 건수, 불량·대기 건수]을 반환한다.
 * 시연용: 실제 상태 객체 S.inspections는 오늘(2026-11-20) 데이터만 보유하므로,
 * 과거 일자 추이·전일/전주 대비 증감 계산에만 시드 기반 합성 데이터를 사용한다.
 * @param {number} count 필요한 과거 일수
 * @returns {Array<[number, number]>} 오래된 날짜 → 어제 순
 */
function pastDailySeries(count) {
  if (count <= PAST_DAYS.length) return PAST_DAYS.slice(PAST_DAYS.length - count);
  const rng = makeRng(20261119);   // 시연용: 고정 시드로 일관된 과거 이력 생성
  const extra = [];
  for (let i = 0; i < count - PAST_DAYS.length; i++) {
    const tot = 92 + Math.round(rng() * 44);
    const bad = Math.max(4, Math.round(tot * (0.068 + rng() * 0.038)));
    extra.push([tot, bad]);
  }
  return [...extra, ...PAST_DAYS];
}

/**
 * 대시보드 기간(오늘 / 7일 / 30일)에 맞는 KPI · 전일/전주 대비 증감 · 일별 추이 데이터를 계산한다.
 * 오늘 수치는 모두 S.inspections에서 실시간 계산하며, 과거 일자만 시연용 합성 데이터를 보완한다.
 * @param {'today'|'7d'|'30d'} period 기간 키
 * @returns {object} 대시보드 지표 묶음
 */
function dashPeriodData(period) {
  const st = getStats(), list = S.inspections, n = list.length;
  const avgScore = n ? list.reduce((a, r) => a + r.score, 0) / n : 0;
  const avgMs = n ? Math.round(list.reduce((a, r) => a + r.ms, 0) / n) : 0;
  const anomCnt = list.filter(r => r.ai === 'ANOMALY').length;
  const rescuedCnt = list.filter(r => r.ai === 'ANOMALY' && r.final === 'NORMAL').length;
  const latestAt = n ? Math.max(...list.map(r => r.at)) : DEMO_DAY_START;

  const chartDays = period === '30d' ? 30 : 7;
  const past = pastDailySeries(chartDays - 1);
  const base = new Date('2026-11-20T00:00:00+09:00');
  const all = [...past, [st.total, st.defect + st.pending]];
  const labels = [], tot = [], bad = [], defects = [];
  all.forEach(([t, b], i) => {
    const dt = new Date(base.getTime() - (all.length - 1 - i) * 86400000);
    labels.push(`${dt.getMonth() + 1}/${dt.getDate()}`);
    tot.push(t);
    bad.push(b);
    // 오늘은 실제 확정 불량 건수, 과거 일자는 시연용 확정 불량 추정치(불량·대기의 약 72%)
    defects.push(i === all.length - 1 ? st.defect : Math.max(1, Math.round(b * 0.72)));
  });

  // KPI 및 비교 기준 계산 (과거 비교치는 시연용 합성 기준)
  let kpiCount, kpiDefects, kpiDefectRate, prevCount, prevDefectRate, cmpLabel, kpiCountLabel;
  if (period === 'today') {
    const yest = PAST_DAYS[PAST_DAYS.length - 1];   // 시연용 어제 [109, 9]
    const yestDef = Math.round(yest[1] * 0.72);
    kpiCountLabel = '오늘 검사 건수'; cmpLabel = '전일 대비';
    kpiCount = st.total; kpiDefects = st.defect;
    kpiDefectRate = st.total ? +(st.defect / st.total * 100).toFixed(1) : 0;
    prevCount = yest[0]; prevDefectRate = +(yestDef / yest[0] * 100).toFixed(1);
  } else {
    const span = period === '30d' ? 30 : 7;
    const prevSpan = pastDailySeries(span * 2 - 1).slice(0, span);   // 시연용 이전 동기간
    kpiCountLabel = `${span}일 검사 건수`; cmpLabel = span === 7 ? '전주 대비' : '전월 대비';
    kpiCount = tot.reduce((a, b) => a + b, 0);
    kpiDefects = defects.reduce((a, b) => a + b, 0);
    kpiDefectRate = kpiCount ? +(kpiDefects / kpiCount * 100).toFixed(1) : 0;
    prevCount = prevSpan.reduce((a, [t]) => a + t, 0);
    const prevDef = prevSpan.reduce((a, [, b]) => a + Math.max(1, Math.round(b * 0.72)), 0);
    prevDefectRate = prevCount ? +(prevDef / prevCount * 100).toFixed(1) : 0;
  }

  const countPct = prevCount ? +((kpiCount - prevCount) / prevCount * 100).toFixed(1) : 0;
  const rateDiff = +(kpiDefectRate - prevDefectRate).toFixed(1);
  const prevPending = 6;   // 시연용 전일 동시간대 검토 대기 기준
  const pendingDiff = st.pending - prevPending;
  const prevScore = period === '30d' ? 0.34 : 0.35;   // 시연용 기준 평균 AI 점수
  const scoreDiff = +(avgScore - prevScore).toFixed(2);

  const bads = list.filter(r => r.final !== 'NORMAL');
  const byType = DEFECT_TYPES.map(t => ({ ...t, n: bads.filter(r => defectTypeOf(r) === t.id).length })).filter(t => t.n > 0).sort((x, y) => y.n - x.n);

  return {
    period, st, labels, tot, bad, defects, byType, typeTotal: bads.length,
    kpiCountLabel, cmpLabel, kpiCount, kpiDefects, kpiDefectRate,
    countPct, rateDiff, pendingDiff, scoreDiff,
    avgScore, avgMs, anomCnt, rescuedCnt, latestAt
  };
}

/**
 * 증감 배지(▲▼) HTML을 생성한다.
 * @param {number} val 증감 수치
 * @param {string} unit 단위('%', '%p', '건', '')
 * @param {boolean} [lowerIsGood] true면 감소가 긍정(불량률·대기·점수)
 */
function deltaPill(val, unit, lowerIsGood = false) {
  if (Math.abs(val) < 0.005) return `<span class="delta flat">━ 0${unit}</span>`;
  const up = val > 0, good = lowerIsGood ? !up : up;
  const num = unit === '' ? Math.abs(val).toFixed(2) : Number.isInteger(val) ? Math.abs(val) : Math.abs(val).toFixed(1);
  return `<span class="delta ${good ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${num}${unit}</span>`;
}

/**
 * 대시보드 일별 검사 건수(막대) + 불량·대기 건수(라인) 이중축 복합 차트(SVG)를 생성한다.
 * @param {object} d dashPeriodData 결과
 * @param {boolean} [highlightToday] 오늘 막대 강조 여부
 * @returns {string} SVG + 범례 + 접근성 표 HTML
 */
function dashTrendChart(d, highlightToday = true) {
  const W = 600, H = 228, L = 42, R = 38, T = 20, B = 28, n = d.labels.length;
  const maxTot = Math.max(40, Math.ceil(Math.max(...d.tot, 1) / 40) * 40);
  const maxBad = Math.max(10, Math.ceil(Math.max(...d.bad, 1) / 5) * 5);
  const plotW = W - L - R, plotH = H - T - B, slot = plotW / n;
  const bw = n <= 8 ? Math.min(34, slot * 0.46) : Math.max(6, slot * 0.62);
  const CX = i => L + slot * (i + 0.5);
  const Yt = v => T + plotH * (1 - v / maxTot);
  const Yb = v => T + plotH * (1 - v / maxBad);

  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = Yt(maxTot * f);
    return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border)" ${f > 0 ? 'stroke-dasharray="3 4"' : ''}/>`
      + `<text class="ct" x="${L - 7}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--text-3)">${Math.round(maxTot * f)}</text>`
      + `<text class="ct" x="${W - R + 7}" y="${y + 3.5}" text-anchor="start" font-size="10" fill="var(--bar-defect)">${Math.round(maxBad * f)}</text>`;
  }).join('');

  const bars = d.tot.map((v, i) => {
    const isToday = i === n - 1, x = CX(i) - bw / 2, y = Yt(v), h = Math.max(2, T + plotH - y);
    const fill = isToday && highlightToday ? 'var(--primary)' : 'var(--bar-normal-soft)';
    const rate = v ? (d.bad[i] / v * 100).toFixed(1) : '0.0';
    const tip = `${d.labels[i]}${isToday ? ' (오늘·실제)' : ' (시연용)'} · 검사 ${v}건 · 불량·대기 ${d.bad[i]}건 (${rate}%)`;
    const showX = n <= 8 || i % 5 === 0 || isToday;
    const by = Yb(d.bad[i]), lblY = Math.abs((y - 6) - by) < 13 ? Math.max(12, Math.min(y, by) - 10) : y - 6;
    return `<g class="hr" data-tip="${tip}">`
      + `<rect class="bar" style="animation-delay:${Math.min(i, 12) * 35}ms" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${n <= 8 ? 5 : 2}" fill="${fill}"/>`
      + (n <= 8 ? `<text class="bar-l ct" x="${CX(i).toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" font-size="10" font-weight="${isToday ? 700 : 500}" fill="${isToday ? 'var(--primary)' : 'var(--text-3)'}">${v}</text>` : '')
      + (showX ? `<text class="ct" x="${CX(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" font-weight="${isToday ? 700 : 500}" fill="${isToday ? 'var(--primary)' : 'var(--text-3)'}">${d.labels[i]}</text>` : '')
      + `<rect class="hit" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${plotH}"/></g>`;
  }).join('');

  const pts = d.bad.map((v, i) => `${CX(i).toFixed(1)},${Yb(v).toFixed(1)}`).join(' ');
  const dots = d.bad.map((v, i) => {
    const isToday = i === n - 1;
    if (n > 8 && i % 3 !== 0 && !isToday) return '';
    return `<circle class="pt" style="animation-delay:${0.3 + Math.min(i, 12) * 0.05}s" cx="${CX(i).toFixed(1)}" cy="${Yb(v).toFixed(1)}" r="${isToday ? 4.2 : (n <= 8 ? 3.5 : 2.5)}" fill="var(--bar-defect)" stroke="var(--bg-card)" stroke-width="1.8" pointer-events="none"/>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="일별 검사 건수 및 불량 추이">${grid}${bars}<polyline class="draw" fill="none" stroke="var(--bar-defect)" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" points="${pts}" pointer-events="none"/>${dots}</svg>
    <div class="chart-legend">
      <span><i class="swatch" style="background:var(--primary)"></i>오늘 검사 건수 (좌축)</span>
      <span><i class="swatch" style="background:var(--bar-normal-soft)"></i>일별 검사 건수 (시연용)</span>
      <span><i class="lswatch" style="background:var(--bar-defect)"></i>불량·대기 건수 (우축)</span>
    </div>
    ${chartTable(['일자', '검사 건수', '불량·대기', '확정 불량'], d.labels.map((l, i) => [l, d.tot[i] + '건', d.bad[i] + '건', d.defects[i] + '건']))}`;
}

/**
 * 대시보드 화면을 생성한다 — PCB QA / AOI 관제 개요 대시보드
 * (상단 기간·갱신·CSV · 4 KPI · 일별 추이 + 불량 유형 분포 · 최근 검사 표 + 검토 대기 큐 · PCB별 양품률 + 시스템 상태).
 * @returns {string} 본문 HTML
 */
function viewDashboard() {
  const period = U.dashPeriod || 'today';
  const d = dashPeriodData(period), st = d.st, list = S.inspections;
  const recent = [...list].sort((a, b) => b.n - a.n).slice(0, 8);
  const pendingList = list.filter(r => r.final === null).sort((a, b) => b.n - a.n).slice(0, 5);
  const topPendingScore = pendingList.length ? Math.max(...pendingList.map(r => r.score)).toFixed(2) : null;
  const gb = list.length * 0.153;
  const chartMode = period === 'today' ? (U.dashChartMode || 'daily') : 'daily';

  // PCB 종류별 양품률 (등록된 PCB + 이력에 존재하는 모든 PCB에서 실시간 집계)
  const pcbIds = [...new Set([...S.pcbs.map(p => p.id), ...list.map(r => r.pcb)])];
  const pcbRows = pcbIds.map(id => {
    const rs = list.filter(r => r.pcb === id), tot = rs.length;
    const norm = rs.filter(r => r.final === 'NORMAL').length;
    const def = rs.filter(r => r.final === 'DEFECT').length;
    const pend = rs.filter(r => r.final === null).length;
    const pct = tot ? +(norm / tot * 100).toFixed(1) : null;
    const defPct = tot ? +(def / tot * 100).toFixed(1) : 0;
    const pendPct = tot ? +(pend / tot * 100).toFixed(1) : 0;
    const meta = S.pcbs.find(p => p.id === id);
    return { id, model: meta ? meta.model : 'Industrial PatchCore', tot, norm, def, pend, pct, defPct, pendPct };
  });

  const periodBtns = [['today', '오늘'], ['7d', '7일'], ['30d', '30일']]
    .map(([k, l]) => `<button class="${period === k ? 'on' : ''}" aria-pressed="${period === k}" onclick="setDashPeriod('${k}')">${l}</button>`).join('');

  return `${pageHead('대시보드', `PCB 외관 검사 품질 현황 · 활성 모델 Industrial PatchCore ${esc(S.model.active)}`, `
      <span class="dash-upd ${S.api.online ? '' : 'off'}" title="마지막 검사 기록 기준 갱신 시각"><i></i>갱신 ${mdhm(d.latestAt)}</span>
      <div class="seg-pills" role="group" aria-label="조회 기간">${periodBtns}</div>
      <button class="btn sm outline" onclick="exportCsv(true)">${ic('download')}CSV 내보내기</button>
    `)}
    ${!S.api.online ? `<div class="banner-off">${ic('lock', 'lg')}<span>PatchCore API 서버 오프라인 — 신규 검사가 중단되었습니다. 기존 이력 조회와 검토 판정은 정상 이용할 수 있습니다.</span></div>` : ''}

    <div class="kpi-grid">
      <button class="kpi click" onclick="gotoHistory('all')" title="전체 검사 이력 보기">
        <div class="kpi-top"><span class="l">${d.kpiCountLabel}</span><span class="kpi-ico g">${ic('scan')}</span></div>
        <div class="kpi-val"><span class="v">${d.kpiCount.toLocaleString()}건</span>${deltaPill(d.countPct, '%', false)}</div>
        <div class="kpi-foot"><span>${d.cmpLabel} · 오늘 정상 ${st.normal}건</span><span>이력 ›</span></div>
      </button>
      <button class="kpi click" onclick="gotoHistory('DEFECT')" title="불량 확정 이력 보기">
        <div class="kpi-top"><span class="l">불량률${period === 'today' ? '' : ` (${period === '7d' ? '7일' : '30일'})`}</span><span class="kpi-ico r">${ic('alert')}</span></div>
        <div class="kpi-val"><span class="v ${d.kpiDefectRate >= 8 ? 'bad' : ''}">${d.kpiDefectRate.toFixed(1)}%</span>${deltaPill(d.rateDiff, '%p', true)}</div>
        <div class="kpi-foot"><span>${d.cmpLabel} · 확정 불량 ${d.kpiDefects}건</span><span>불량 ›</span></div>
      </button>
      <button class="kpi click ${st.pending ? 'warn-card' : ''}" onclick="U.rvFilter='pending';go('review')" title="검사 관리 화면으로 이동">
        <div class="kpi-top"><span class="l">검토 대기 건수</span><span class="kpi-ico o">${ic('check')}</span></div>
        <div class="kpi-val"><span class="v ${st.pending ? 'warn' : 'good'}">${st.pending}건</span>${deltaPill(d.pendingDiff, '건', true)}</div>
        <div class="kpi-foot"><span>${topPendingScore ? `최고 AI 점수 ${topPendingScore}` : '모든 의심 건 처리 완료'}</span><span style="color:var(--primary);font-weight:700">검토하기 ›</span></div>
      </button>
      <div class="kpi">
        <div class="kpi-top"><span class="l">평균 AI 점수</span><span class="kpi-ico">${ic('activity')}</span></div>
        <div class="kpi-val"><span class="v">${d.avgScore.toFixed(2)}</span>${deltaPill(d.scoreDiff, '', true)}</div>
        <div class="kpi-foot"><span>임계값 ${S.model.threshold.toFixed(2)} · 평균 ${d.avgMs}ms</span><span>일치율 ${st.match}%</span></div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="card">

/**
 * 대시보드 KPI 카드에서 검사 이력 화면으로 필터를 적용해 이동한다.
 * @param {string} flt 'all' | 'NORMAL' | 'DEFECT' | 'PENDING'
 */
function gotoHistory(flt) { U.hf = { period: 'all', pcb: 'all', result: flt, q: '' }; go('history'); }

/* ═══════════════════════════════════════════════════════════════════════════
   6. [메뉴 2] PCB 검사 — PCB 선택 · 촬영/업로드 · PatchCore API 호출
   ═══════════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   6. [메뉴 2] PCB 검사 — PCB 종류 선택 · 여러 장 업로드(드래그 앤 드롭) · 일괄 검사
   ═══════════════════════════════════════════════════════════════════════════ */
/** 한 번에 올릴 수 있는 최대 이미지 수 (시연 기준 — 브라우저 메모리 보호) */
const MAX_BATCH = 50;

/**
 * PCB 종류 이름을 알아보기 쉬운 칩(칩 아이콘 + 이름)으로 표시한다.
 * PCB 종류는 '검사 대상 제품(기판)의 등록 이름'이며 정상 기준 사진이 아니다.
 * @param {string} name PCB 종류 이름(예: PCB1)
 * @returns {string} HTML
 */
function pcbTag(name) { return `<span class="ptype" title="PCB 종류 — 검사 대상 제품(기판)의 등록 이름">${ic('chip')}${esc(name)}</span>`; }

/**
 * 바이트 수를 읽기 쉬운 문자열로 바꾼다.
 * @param {number} b 바이트
 * @returns {string} 예: 1.2 MB
 */
function fmtBytes(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }

/**
 * 검사 대기열 항목을 만든다.
 * @param {{name: string, src: string, size?: number, seed?: number, sample?: boolean}} o 이미지 정보
 * @returns {object} 대기열 항목 (st: wait | run | done)
 */
function newQueueItem(o) { return { uid: ++U.qSeq, name: o.name, src: o.src, key: o.key || '', size: o.size || 0, seed: o.seed || 7, sample: !!o.sample, path: o.path || '', st: 'wait', rec: null }; }

/** 대기열에 이미지를 추가하고 화면을 갱신한다. @param {object[]} list newQueueItem 입력 배열 */
function queueAdd(list) { list.forEach(o => U.queue.push(newQueueItem(o))); render(); }

/** 촬영 버튼: 샘플 촬영 이미지를 대기열에 추가한다 (시안 — 실제 카메라 연동은 시스템 설정의 카메라 항목에서 제공 예정). */
function capture() {
  if (U.running) return;
  if (U.queue.length >= MAX_BATCH) return toast(`한 번에 최대 ${MAX_BATCH}장까지 검사할 수 있습니다`);
  const k = U.capSeq = (U.capSeq || 0) + 1, pool = k % 2 ? SAMPLE_ANOM : SAMPLE_NORM, nm = pool[(k >> 1) % pool.length];   // 불량·정상 샘플을 번갈아 촬영한 것처럼 보여 준다(시안)
  queueAdd([{ ...sampleItem(nm), name: '촬영 이미지 ' + new Date().toTimeString().slice(0, 8) }]);
  toast('촬영 완료 — 대기열에 추가했습니다 (시안: 샘플 이미지)');
}

/** 샘플 세트(정상 기판 4 · 불량 6종 각 1장)를 대기열에 한 번에 추가한다. 파일명으로 정답 불량 위치가 연결된다. */
function loadSampleSet() {
  if (U.running) return;
  const names = [...SAMPLE_NORM.slice(0, 4), ...SAMPLE_ANOM.slice(0, 6)], room = MAX_BATCH - U.queue.length;
  if (room < names.length) return toast(`대기열 자리가 부족합니다 (${names.length}장 필요 · 최대 ${MAX_BATCH}장)`);
  queueAdd(names.map(sampleItem)); toast(`샘플 ${names.length}장을 추가했습니다 (공개 PCB 사진)`);
}

/** 파일 선택 창을 연다 (여러 장 선택 가능). */
function pickFile() { if (!U.running) document.getElementById('fileInput').click(); }

/**
 * 이미지 파일 여러 개를 읽어 검사 대기열에 추가한다 (이미지가 아닌 파일 · 최대 장수 초과분은 제외하고 안내).
 * @param {FileList|File[]} files 선택하거나 끌어다 놓은 파일들
 */
function addFiles(files) {
  if (U.running) return toast('검사 중에는 이미지를 추가할 수 없습니다');
  const all = [...files], imgs = all.filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|bmp|webp)$/i.test(f.name));
  const skipType = all.length - imgs.length, room = Math.max(0, MAX_BATCH - U.queue.length), take = imgs.slice(0, room), skipMax = imgs.length - take.length;
  if (!take.length) return toast(skipType ? '이미지 파일(PNG · JPG · BMP · WebP)만 추가할 수 있습니다' : `한 번에 최대 ${MAX_BATCH}장까지 검사할 수 있습니다`);
  Promise.all(take.map(f => new Promise(res => { const fr = new FileReader(); fr.onload = () => res({ name: f.name, src: fr.result, size: f.size, seed: f.size + f.name.length }); fr.onerror = () => res(null); fr.readAsDataURL(f); })))
    .then(list => {
      list = list.filter(Boolean); queueAdd(list);
      toast(`${list.length}장을 추가했습니다` + (skipType ? ` · 이미지가 아닌 ${skipType}개 제외` : '') + (skipMax ? ` · 최대 ${MAX_BATCH}장 초과 ${skipMax}장 제외` : ''));
    });
}
document.getElementById('fileInput').addEventListener('change', e => { const arr = [...e.target.files]; e.target.value = ''; if (arr.length) addFiles(arr); });

/** 드롭 영역 위에 파일을 끌고 왔을 때 강조한다. */
function dzOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
/** 드롭 영역에서 벗어나면 강조를 끈다. */
function dzLeave(e) { e.currentTarget.classList.remove('over'); }
/**
 * 드롭 영역에 파일을 놓았을 때 대상에 맞게 처리한다.
 * @param {DragEvent} e 드롭 이벤트
 * @param {'queue'|'bank'} target queue=검사 대기열, bank=PCB 종류별 데이터뱅크
 */
function dzDrop(e, target) {
  e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove('over');
  if (target === 'bank') addBankFiles(e.dataTransfer.files); else addFiles(e.dataTransfer.files);
}
// 드롭 영역 밖에 놓아도 브라우저가 파일을 열어 버리지 않게 막고, PCB 검사 화면에서는 어디에 놓아도 대기열에 추가한다.
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (S.user && U.route === 'inspect' && e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/** 대기열에서 이미지 한 장을 뺀다. @param {number} uid 항목 번호 */
function queueRemove(uid) { if (U.running) return; U.queue = U.queue.filter(q => q.uid !== uid); render(); }
/** 대기열을 모두 비운다(검사 결과 기록은 이력에 남는다). */
function queueClear() { if (U.running) return; U.queue = []; render(); }
/** 검사가 끝난 항목만 목록에서 치운다. */
function queueClearDone() { if (U.running) return; U.queue = U.queue.filter(q => q.st !== 'done'); render(); }

/**
 * 외부 PatchCore API 응답을 모사해 이상 점수를 산출한다 (시연용: 샘플은 순환 값, 업로드 파일은 파일 정보 기반).
 * @param {object} q 대기열 항목
 * @returns {number} 0~1 이상 점수
 */
function mockApiScore(q) {
  const m = SAMPLES[q.key || q.name];
  if (m) { const k = S.demoSeq++; return m[0] === 'A' ? [0.72, 0.88, 0.81, 0.67][k % 4] : [0.21, 0.34, 0.18, 0.27][k % 4]; }   // 샘플 이미지는 정답에 맞춰 점수를 정한다(시안)
  const cycle = [0.72, 0.21, 0.88, 0.34];
  if (q.sample) return cycle[S.demoSeq++ % cycle.length];
  return +(0.12 + ((q.seed || 7) * 37 % 83) / 100).toFixed(2);
}

/** 지정 시간(ms)만큼 기다린다(모션 감소 설정이면 짧게). */
const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 120) : ms));

/**
 * 일괄 검사: 대기 중인 이미지를 순서대로 PatchCore API에 보내고(시뮬레이션) 결과를 검사 이력에 저장한다.
 * AI 이상 → '검토 대기' 큐 편입 / AI 정상 → 정상 자동 확정. 실서비스에서는 같은 POST /api/inspections 를 이미지마다 호출한다.
 * 서버 연결이 끊기면 남은 이미지는 대기 상태로 두고 중단한다. 검사 도중 로그아웃하거나 데모를 초기화하면 이후 이미지는 저장하지 않고 멈춘다.
 */
async function runBatch() {
  if (U.running) return;
  if (!S.api.online) return toast('PatchCore API 서버가 오프라인입니다. 연결 복구 후 다시 시도하세요');
  const todo = U.queue.filter(q => q.st !== 'done');
  if (!todo.length) return toast('검사할 이미지를 추가하세요');
  U.running = true; render();
  const S0 = S, redraw = () => { if (U.route === 'inspect') render(); };   // S0: 도중에 로그아웃·데모 초기화로 상태가 바뀌면 이어서 저장하지 않기 위한 기준
  let ok = 0, anom = 0, stopped = false, aborted = false;
  for (const q of todo) {
    if (S !== S0 || !S.user) { aborted = true; break; }
    if (!S.api.online) { stopped = true; break; }
    q.st = 'run'; redraw(); await sleep(650);
    if (S !== S0 || !S.user) { aborted = true; break; }
    const thr = S.model.threshold, score = mockApiScore(q), last = Math.max(...S.inspections.map(r => r.n)), prevAt = S.inspections.find(r => r.n === last).at;
    const n = last + 1, rng = makeRng((Date.now() + n * 97) % 100000), ai = score >= thr ? 'ANOMALY' : 'NORMAL', bx = boxesOf(q.key || q.name);
    const rec = { n, id: 'INS-' + String(n).padStart(6, '0'), pcb: U.pcb, score, thr, ver: S.model.active, ai, final: ai === 'NORMAL' ? 'NORMAL' : null, memo: '',
      at: prevAt + 120000 + Math.round(rng() * 60000), ms: 380 + Math.round(rng() * 160),
      spot: bx.length ? spotOf(bx) : { x: 20 + Math.round(rng() * 60), y: 22 + Math.round(rng() * 56), r: 10 + Math.round(rng() * 6) }, boxes: bx, img: q.src };
    S.inspections.push(rec); q.rec = rec; q.st = 'done'; ok++; if (ai === 'ANOMALY') anom++;
    redraw();
  }
  for (const q of U.queue) if (q.st === 'run') q.st = 'wait';
  U.running = false;
  if (aborted) { if (S.user) render(); return; }   // 로그아웃·데모 초기화로 중단: 새 상태에는 아무것도 저장하지 않는다
  U.fresh = true; render();
  toast(stopped ? `서버 연결이 끊겨 ${ok}장까지 검사하고 중단했습니다` : `${ok}장 검사 완료 · 정상 ${ok - anom} · 이상 의심 ${anom}${anom ? ' — 검토 대기로 등록' : ''}`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   6-1. 서버 저장소 파일 관리자 (PCB 검사 → 팝업) — 시안: 서버 저장소를 흉내 낸 가상 폴더 트리
   - 내부 경로는 항상 '저장소 기준 상대 경로 + / 구분자'(예: /입고/2026-11-21/a.jpg)로 다루고, 화면 표시·입력만 서버 OS(Linux · Windows)에 맞춘다.
     DB에도 이 상대 경로만 저장하면 서버 OS가 바뀌어도(Linux ↔ Windows) 데이터를 그대로 쓸 수 있다.
   - 실서비스에서는 GET /api/storage/list?path= (목록) 와 POST /api/inspections (선택한 경로로 검사) 로 연동한다.
   ═══════════════════════════════════════════════════════════════════════════ */
/** OS별 저장소 기본 경로 */
const FS_DEFAULT = { Linux: '/srv/circuiteye/storage', Windows: 'D:\\circuiteye\\storage' };
/** @param {'Linux'|'Windows'} os @returns {string} 해당 OS의 기본 저장소 경로 */
function defaultStoragePath(os) { return FS_DEFAULT[os] || FS_DEFAULT.Linux; }

/**
 * 저장소 경로가 서버 OS 규칙에 맞는지 검사한다.
 * @param {'Linux'|'Windows'} os 서버 OS
 * @param {string} p 입력 경로
 * @returns {{ok: boolean, msg?: string}} 결과(실패 시 안내 문구)
 */
function checkStoragePath(os, p) {
  p = String(p || '').trim();
  if (!p) return { ok: false, msg: '경로를 입력하세요' };
  if (p.length > 200) return { ok: false, msg: '경로가 너무 깁니다 (200자 이내)' };
  if (p.split(/[\\/]+/).includes('..')) return { ok: false, msg: '상위 경로(..)는 사용할 수 없습니다' };
  if (os === 'Windows') {
    if (!/^[A-Za-z]:[\\/]/.test(p) && !/^[\\/]{2}[^\\/]+[\\/]+[^\\/]+/.test(p)) return { ok: false, msg: 'Windows 경로는 드라이브(D:\\…) 또는 네트워크 경로(\\\\서버\\공유)로 시작해야 합니다' };
    if (/[<>"|?*\0]/.test(p) || /:/.test(p.slice(2))) return { ok: false, msg: 'Windows에서 쓸 수 없는 문자가 있습니다 ( < > : " | ? * )' };
    return { ok: true };
  }
  if (p[0] !== '/') return { ok: false, msg: 'Linux 경로는 /로 시작하는 절대 경로여야 합니다 (예: /srv/circuiteye/storage)' };
  if (/\\/.test(p)) return { ok: false, msg: 'Linux 경로에는 역슬래시(\\) 대신 /를 사용하세요' };
  if (/\0/.test(p)) return { ok: false, msg: '쓸 수 없는 문자가 있습니다' };
  return { ok: true };
}

/** 경로를 OS 표기로 정리한다 (구분자 통일 · 중복·끝 구분자 제거). */
function normStoragePath(os, p) {
  p = String(p).trim();
  if (os === 'Windows') { const unc = /^[\\/]{2}/.test(p); p = p.replace(/[\\/]+/g, '\\'); if (unc) p = '\\' + p; return p.length > 3 ? p.replace(/\\$/, '') : p; }
  p = p.replace(/\/+/g, '/'); return p.length > 1 ? p.replace(/\/$/, '') : p;
}

/** 시스템 설정: 저장소 경로를 저장한다 (관리자). 형식이 틀리면 거부하고 되돌린다. */
function setStoragePath(v) {
  if (!isAdmin()) return;
  const os = S.settings.serverOs, c = checkStoragePath(os, v);
  if (!c.ok) { toast(c.msg); return render(); }
  S.settings.storagePath = normStoragePath(os, v); toast('저장소 경로를 저장했습니다'); render();
}

/** 시스템 설정: 서버 운영체제를 바꾼다. 현재 경로가 새 OS 규칙에 맞지 않으면 그 OS의 기본 경로로 바꾼다. */
function setServerOs(v) {
  if (!isAdmin() || !FS_DEFAULT[v]) return;
  S.settings.serverOs = v;
  const keep = checkStoragePath(v, S.settings.storagePath).ok;
  if (!keep) S.settings.storagePath = defaultStoragePath(v);
  U.fmLast = ''; toast(`서버 OS를 ${v}(으)로 설정했습니다` + (keep ? '' : ` · 저장소 경로를 기본값(${S.settings.storagePath})으로 바꿨습니다`)); render();
}

/** 가상 저장소 트리(최초 1회 생성). 폴더 {n,d,c} · 이미지 {n,f,sz,t} · 그 밖의 파일 {n,sz,t,other} */
let FS_TREE = null;
function fsTree() {
  if (FS_TREE) return FS_TREE;
  const N = SAMPLE_NORM, A = SAMPLE_ANOM;
  const sz = n => 62000 + ([...n].reduce((a, c) => a + c.charCodeAt(0), 0) * 131 % 34000);   // 파일명으로 정한 고정 크기(시안)
  const f = t => n => ({ n, f: n, sz: sz(n), t }), d = (n, c) => ({ n, d: 1, c });
  const mix = (nn, aa, t) => [...nn, ...aa].sort().map(f(t));
  return FS_TREE = d('', [
    d('입고', [
      d('2026-11-21', [...mix(N.slice(0, 8), A.slice(0, 3), '2026-11-21 09:12'), { n: '촬영기록.csv', sz: 2140, t: '2026-11-21 09:12', other: 1 }]),
      d('2026-11-20', mix(N.slice(8, 16), A.slice(3, 5), '2026-11-20 17:40')),
      d('라인B', [d('2026-11-19', mix(N.slice(16, 20), A.slice(5, 9), '2026-11-19 15:05'))])
    ]),
    d('보관', [d('PCB1', [d('정상', N.slice(20).map(f('2026-11-10 11:00'))), d('불량', A.slice(9, 21).map(f('2026-11-12 14:30')))])]),
    { n: '메모.txt', sz: 318, t: '2026-11-01 10:00', other: 1 }
  ]);
}

/** 폴더 이름 비교: Linux는 대소문자 구분, Windows는 구분하지 않는다. */
const fsSame = (a, b) => S.settings.serverOs === 'Windows' ? a.toLowerCase() === b.toLowerCase() : a === b;

/**
 * 상대 경로의 노드를 찾는다.
 * @param {string} rel 예: /입고/2026-11-21
 * @returns {{node: object, path: string}|null} 노드와 실제 이름으로 정리한 경로
 */
function fsNode(rel) {
  let node = fsTree(), path = '';
  for (const seg of String(rel).split('/').filter(Boolean)) {
    const nx = node.d && node.c.find(x => fsSame(x.n, seg)); if (!nx) return null;
    node = nx; path += '/' + nx.n;
  }
  return { node, path: path || '/' };
}

/** 상대 경로를 서버 OS 표기의 전체 경로로 바꾼다 (예: /srv/circuiteye/storage/입고 · D:\circuiteye\storage\입고). */
function fsDisplay(rel) {
  const win = S.settings.serverOs === 'Windows', root = S.settings.storagePath.replace(/[\\/]+$/, '');
  const tail = rel === '/' ? '' : (win ? rel.replace(/\//g, '\\') : rel);
  return (root + tail) || S.settings.storagePath;
}

/**
 * 사용자가 경로 입력칸에 쓴 문자열(Linux · Windows 표기 모두 허용)을 저장소 상대 경로로 바꾼다.
 * 저장소 밖 · 상위 경로(..) · 없는 폴더는 거부한다.
 * @param {string} text 입력 문자열
 * @returns {{path?: string, err?: string}}
 */
function fsParse(text) {
  let t = String(text || '').trim().replace(/^["']|["']$/g, '').replace(/\\/g, '/');
  if (!t) return { err: '경로를 입력하세요' };
  const root = S.settings.storagePath.replace(/\\/g, '/').replace(/\/+$/, ''), win = S.settings.serverOs === 'Windows';
  const eq = (a, b) => win ? a.toLowerCase() === b.toLowerCase() : a === b;
  const abs = /^\//.test(t) || /^[A-Za-z]:/.test(t);
  if (abs) { if (!(t.length >= root.length && eq(t.slice(0, root.length), root) && (t.length === root.length || t[root.length] === '/'))) return { err: `저장소(${fsDisplay('/')}) 밖의 경로는 열 수 없습니다` }; t = t.slice(root.length); }
  const segs = t.split('/').filter(s => s && s !== '.');
  if (segs.includes('..')) return { err: '상위 경로(..)는 사용할 수 없습니다' };
  const hit = fsNode('/' + segs.join('/'));
  if (!hit) return { err: '해당 폴더를 찾을 수 없습니다' + (win ? '' : ' (Linux는 대소문자를 구분합니다)') };
  if (!hit.node.d) return { err: '폴더가 아니라 파일입니다' };
  return { path: hit.path };
}

/** 폴더 아래의 이미지 파일을 모두 모은다. @returns {{p: string, n: object}[]} 경로와 파일 노드 */
function fsImages(node, base) {
  const out = [];
  (function walk(nd, p) { nd.c.forEach(x => { const q = (p === '/' ? '' : p) + '/' + x.n; if (x.d) walk(x, q); else if (x.f) out.push({ p: q, n: x }); }); })(node, base);
  return out;
}

/** 파일 관리자 팝업을 연다. */
function openFileManager() {
  if (U.running) return;
  U.fm = { path: fsNode(U.fmLast || '/입고') ? (U.fmLast || '/입고') : '/', sel: new Set(), q: '', view: (U.fm && U.fm.view) || 'list', err: '', ents: [], last: -1 };
  openModal(fmInner()); document.querySelector('#modal .modal-card').classList.add('fmc');
}

/** 팝업 전체 내용 */
function fmInner() {
  const m = U.fm, segs = m.path.split('/').filter(Boolean), os = S.settings.serverOs;
  const crumbs = [`<button onclick="fmGo('/')">저장소</button>`].concat(segs.map((s, i) => `<i>${os === 'Windows' ? '\\' : '/'}</i><button onclick="fmGo('/${segs.slice(0, i + 1).map(x => encodeURIComponent(x)).join('/')}',1)">${esc(s)}</button>`)).join('');
  const sc = (p, lbl) => `<button class="${m.path === p || (p !== '/' && m.path.startsWith(p + '/')) ? 'on' : ''}" onclick="fmGo('${p}')">${ic('folder')}${lbl}</button>`;
  return `<div class="fm-head"><div class="row between"><b style="font-size:17px">서버 저장소에서 선택</b><button class="icon-btn" onclick="closeModal()" aria-label="닫기">${ic('x')}</button></div>
      <div class="fm-bar mt8"><button class="btn sm outline" onclick="fmUp()" ${m.path === '/' ? 'disabled' : ''} title="상위 폴더">↑ 위로</button>
        <input class="inp fm-path" id="fmPath" value="${esc(fsDisplay(m.path))}" aria-label="경로 (Linux · Windows 표기 모두 입력 가능)" spellcheck="false" onkeydown="if(event.key==='Enter')fmGoText(this.value)">
        <button class="btn sm outline" onclick="fmGoText(document.getElementById('fmPath').value)">이동</button>
        <button class="btn sm ${m.view === 'list' ? 'primary' : 'outline'}" onclick="fmView('list')">목록</button><button class="btn sm ${m.view === 'grid' ? 'primary' : 'outline'}" onclick="fmView('grid')">격자</button></div>
      <div class="fm-crumbs">${crumbs}</div><div class="fm-err" id="fmErr" role="alert">${esc(m.err)}</div>
      <div class="row mt6"><input class="inp" style="max-width:260px" id="fmQ" placeholder="이 폴더에서 파일 이름 검색" value="${esc(m.q)}" oninput="fmSearch(this.value)" aria-label="이 폴더에서 파일 이름 검색"><span class="small muted">서버 OS: <b>${esc(os)}</b> · ${os === 'Windows' ? '경로는 대소문자를 구분하지 않음' : '경로는 대소문자를 구분'}</span></div></div>
    <div class="fm-main"><div class="fm-side"><div class="lbl">빠른 이동</div>${sc('/', '저장소 전체')}${sc('/입고', '입고 (촬영 사진)')}${sc('/보관', '보관 (검사 완료)')}
        <div class="lbl">내 컴퓨터</div><button onclick="fmLocal()">${ic('upload')}내 컴퓨터에서 파일 선택</button></div>
      <div class="fm-body" id="fmBody">${fmBodyHtml()}</div></div>
    <div class="fm-foot" id="fmFoot">${fmFootHtml()}</div>`;
}

/** 현재 폴더 목록(목록형/격자형). 폴더 → 이미지 → 그 밖의 파일 순. */
function fmBodyHtml() {
  const m = U.fm, here = fsNode(m.path);
  if (!here) return '<div class="empty">폴더를 찾을 수 없습니다</div>';
  const q = m.q.trim().toLowerCase(), base = m.path === '/' ? '' : m.path;
  const kids = here.node.c.filter(x => !q || x.n.toLowerCase().includes(q));
  const ents = [...kids.filter(x => x.d), ...kids.filter(x => x.f), ...kids.filter(x => x.other)].map(x => ({ k: x.d ? 'd' : x.f ? 'f' : 'o', x, p: base + '/' + x.n }));
  m.ents = ents;
  if (!ents.length) return `<div class="empty">${ic('folder')}${q ? '검색 결과가 없습니다' : '비어 있는 폴더입니다'}</div>`;
  const info = e => { if (e.k !== 'd') return null; const im = fsImages(e.x, e.p); return { total: im.length, n: im.filter(v => m.sel.has(v.p)).length }; };
  const dim = e => e.k === 'o';
  if (m.view === 'grid') return `<div class="fm-grid">${ents.map((e, i) => { const f = e.k === 'd' ? info(e) : null, on = e.k === 'f' ? m.sel.has(e.p) : f && f.total && f.n === f.total;
    return `<div class="fm-card ${on ? 'sel' : ''} ${dim(e) ? 'dim' : ''}" onclick="fmClick(${i},event)">${dim(e) ? '' : `<input type="checkbox" ${on ? 'checked' : ''} onclick="event.stopPropagation()" onchange="fmToggle(${i},event.shiftKey)" aria-label="${esc(e.x.n)} 선택">`}
      <div class="th">${e.k === 'f' ? `<img loading="lazy" src="${esc(sampleSrc(e.x.f))}" alt="">` : ic(e.k === 'd' ? 'folder' : 'db')}</div>
      <div class="fm-nm" title="${esc(e.x.n)}">${esc(e.x.n)}</div><div class="small muted">${e.k === 'd' ? `이미지 ${f.total}장${f.n ? ` · ${f.n} 선택` : ''}` : e.k === 'f' ? fmtBytes(e.x.sz) : '이미지 아님'}</div></div>`; }).join('')}</div>`;
  return `<div class="fm-row hd"><span></span><span></span><span>이름</span><span class="fm-dt">수정한 날짜</span><span>크기</span></div>` + ents.map((e, i) => {
    const f = e.k === 'd' ? info(e) : null, on = e.k === 'f' ? m.sel.has(e.p) : f && f.total && f.n === f.total;
    return `<div class="fm-row ${on ? 'sel' : ''} ${dim(e) ? 'dim' : ''}" onclick="fmClick(${i},event)">${dim(e) ? '<span></span>' : `<input type="checkbox" ${on ? 'checked' : ''} onclick="event.stopPropagation()" onchange="fmToggle(${i},event.shiftKey)" aria-label="${esc(e.x.n)} 선택">`}
      <span class="bk-ico">${e.k === 'f' ? `<img loading="lazy" src="${esc(sampleSrc(e.x.f))}" alt="">` : ic(e.k === 'd' ? 'folder' : 'db')}</span><span class="fm-nm" title="${esc(e.x.n)}">${esc(e.x.n)}${e.k === 'o' ? ' <span class="small muted">· 이미지 아님</span>' : ''}</span>
      <span class="small muted fm-dt">${e.k === 'd' ? '' : esc(e.x.t || '')}</span><span class="small muted">${e.k === 'd' ? `${f.total}장${f.n ? ` (${f.n} 선택)` : ''}` : fmtBytes(e.x.sz)}</span></div>`; }).join('');
}

/** 하단 바: 선택 장수 · 일괄 선택 · 추가 버튼 */
function fmFootHtml() {
  const m = U.fm, n = m.sel.size, room = MAX_BATCH - U.queue.length, here = fsNode(m.path), deep = here ? fsImages(here.node, m.path).length : 0;
  return `<button class="btn sm outline" onclick="fmSelAll()" ${deep ? '' : 'disabled'}>이 폴더 이미지 모두 선택 (하위 포함 ${deep}장)</button><button class="btn sm outline" onclick="fmClear()" ${n ? '' : 'disabled'}>선택 해제</button>
    <span class="sp"></span><span class="small ${n > room ? '' : 'muted'}" ${n > room ? 'style="color:var(--bad);font-weight:600"' : ''}><b>${n}장</b> 선택${n > room ? ` · 대기열 여유 ${Math.max(0, room)}장만 추가됩니다` : ` · 대기열 여유 ${room}장`}</span>
    <button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="fmAdd" onclick="fmAdd()" ${n ? '' : 'disabled'}>검사 대기열에 추가</button>`;
}

/** 팝업 일부(목록 · 하단)만 다시 그린다 (검색 입력칸의 커서를 유지). */
function fmRedrawBody() { const b = document.getElementById('fmBody'), f = document.getElementById('fmFoot'); if (b) b.innerHTML = fmBodyHtml(); if (f) f.innerHTML = fmFootHtml(); }
/** 팝업 전체를 다시 그린다. */
function fmRedraw() { const c = document.querySelector('#modal .modal-card'); if (c) c.innerHTML = fmInner(); }
/** 폴더로 이동한다. @param {string} p 저장소 상대 경로 @param {number} [enc] 1이면 URI 인코딩된 경로 */
function fmGo(p, enc) { if (enc) p = decodeURIComponent(p).replace(/%2F/g, '/'); const h = fsNode(p); if (!h || !h.node.d) return; U.fm.path = U.fmLast = h.path; U.fm.q = ''; U.fm.err = ''; U.fm.last = -1; fmRedraw(); }
/** 상위 폴더로 이동한다. */
function fmUp() { const s = U.fm.path.split('/').filter(Boolean); s.pop(); fmGo('/' + s.join('/')); }
/** 입력칸에 쓴 경로로 이동한다 (Linux · Windows 표기 모두). */
function fmGoText(t) { const r = fsParse(t); if (r.err) { U.fm.err = r.err; const e = document.getElementById('fmErr'); if (e) e.textContent = r.err; return; } fmGo(r.path); }
/** 보기 방식(목록 · 격자)을 바꾼다. */
function fmView(v) { U.fm.view = v; fmRedraw(); }
/** 현재 폴더 안에서 이름으로 거른다. */
function fmSearch(q) { U.fm.q = q; U.fm.last = -1; fmRedrawBody(); }
/** 항목 행을 눌렀을 때: 폴더는 열고, 이미지는 선택을 바꾼다. */
function fmClick(i, ev) { const e = U.fm.ents[i]; if (!e || e.k === 'o') return; if (e.k === 'd') return fmGo(e.p); fmToggle(i, ev && ev.shiftKey); }
/** 선택 바꾸기: 이미지는 개별 · Shift는 범위, 폴더는 하위 이미지 전체. */
function fmToggle(i, shift) {
  const m = U.fm, e = m.ents[i]; if (!e) return;
  if (e.k === 'd') { const im = fsImages(e.x, e.p), all = im.every(v => m.sel.has(v.p)); im.forEach(v => all ? m.sel.delete(v.p) : m.sel.add(v.p)); }
  else if (e.k === 'f') {
    if (shift && m.last >= 0) { const [a, b] = [Math.min(m.last, i), Math.max(m.last, i)], on = !m.sel.has(e.p); for (let k = a; k <= b; k++) if (m.ents[k].k === 'f') on ? m.sel.add(m.ents[k].p) : m.sel.delete(m.ents[k].p); }
    else m.sel.has(e.p) ? m.sel.delete(e.p) : m.sel.add(e.p);
    m.last = i;
  }
  fmRedrawBody();
}
/** 현재 폴더의 이미지를 하위 폴더까지 모두 선택한다. */
function fmSelAll() { const h = fsNode(U.fm.path); if (h) fsImages(h.node, U.fm.path).forEach(v => U.fm.sel.add(v.p)); fmRedrawBody(); }
/** 선택을 모두 해제한다. */
function fmClear() { U.fm.sel.clear(); fmRedrawBody(); }
/** 내 컴퓨터의 파일 선택 창으로 전환한다. */
function fmLocal() { closeModal(); pickFile(); }
/** 선택한 이미지를 검사 대기열에 추가한다 (이미 담긴 경로 · 최대 장수 초과분은 제외). */
function fmAdd() {
  if (U.running) return;
  const have = new Set(U.queue.map(q => q.path).filter(Boolean)), picked = [...U.fm.sel].sort(), fresh = picked.filter(p => !have.has(p));
  const room = Math.max(0, MAX_BATCH - U.queue.length), take = fresh.slice(0, room), dup = picked.length - fresh.length, over = fresh.length - take.length;
  if (!take.length) return toast(dup ? '이미 대기열에 있는 이미지입니다' : `한 번에 최대 ${MAX_BATCH}장까지 검사할 수 있습니다`);
  const items = take.map(p => { const h = fsNode(p), nm = h.node.f; return { ...sampleItem(nm), path: h.path, size: h.node.sz }; });
  closeModal(); queueAdd(items);
  toast(`서버 저장소에서 ${items.length}장을 추가했습니다` + (dup ? ` · 이미 담긴 ${dup}장 제외` : '') + (over ? ` · 최대 ${MAX_BATCH}장 초과 ${over}장 제외` : ''));
}

/* ═══════════════════════════════════════════════════════════════════════════
   6-2. PCB 종류별 데이터뱅크 (데이터 관리 메뉴) — 정상 기준 이미지 · Memory Bank 파일 업로드 (시연: 브라우저 메모리에만 보관)
   ═══════════════════════════════════════════════════════════════════════════ */
/** 선택한 PCB 종류의 데이터뱅크 파일 목록을 돌려준다(없으면 빈 배열). @param {string} id PCB 종류 이름 */
const bankOf = id => S.banks[id] || (S.banks[id] = []);

/** 데이터뱅크 대상 PCB 종류를 바꾼다. @param {string} id PCB 종류 이름 */
function setBankPcb(id) { U.bankPcb = id; render(); }

/**
 * 데이터뱅크에 파일 여러 개를 올린다. 이미지는 '정상 이미지', 그 밖의 파일(.zip · .npy · .pt …)은 'Memory Bank 파일'로 분류한다.
 * 시연에서는 파일을 서버로 보내지 않고 브라우저 메모리에만 보관한다(새로고침하면 사라짐).
 * @param {FileList|File[]} files 선택하거나 끌어다 놓은 파일들
 */
function addBankFiles(files) {
  if (!isAdmin()) return toast('데이터뱅크 업로드는 관리자만 할 수 있습니다');
  const arr = bankOf(U.bankPcb), list = [...files]; if (!list.length) return;
  const room = Math.max(0, 200 - arr.length), take = list.slice(0, room);
  take.forEach(f => {
    const img = /^image\//.test(f.type) || /\.(png|jpe?g|bmp|webp)$/i.test(f.name);
    arr.push({ id: Date.now() + '-' + arr.length + Math.random().toString(36).slice(2, 5), name: f.name, size: f.size, kind: img ? 'image' : 'bank', at: Date.now(), src: img ? URL.createObjectURL(f) : '' });
  });
  render(); toast(`${take.length}개를 ${U.bankPcb} 데이터뱅크에 추가했습니다 (시연: 브라우저 메모리)` + (list.length > take.length ? ` · 200개 초과 ${list.length - take.length}개 제외` : ''));
}
document.getElementById('bankInput').addEventListener('change', e => { const a = [...e.target.files]; e.target.value = ''; addBankFiles(a); });

/** 데이터뱅크 파일을 하나 지운다. @param {string} id PCB 종류 @param {string} fid 파일 id */
function bankDelete(id, fid) {
  if (!isAdmin()) return;
  const arr = bankOf(id), f = arr.find(x => x.id === fid); if (!f) return;
  if (f.src) URL.revokeObjectURL(f.src);
  S.banks[id] = arr.filter(x => x.id !== fid); render(); toast(`${f.name} 삭제`);
}

/**
 * 데이터 관리 화면의 'PCB 종류별 데이터뱅크' 카드를 생성한다.
 * 종류별 요약 표 + 선택한 종류의 업로드 영역(관리자) · 파일 목록. 실서비스에서는 서버 저장소와 pcb_banks 테이블을 사용하고,
 * 학습 연결(Custom PatchCore)은 후속 확장이다.
 * @param {boolean} adm 관리자 여부
 * @returns {string} HTML
 */
function bankCardHtml(adm) {
  if (!S.pcbs.some(p => p.id === U.bankPcb)) U.bankPcb = S.pcbs[0].id;
  const cur = U.bankPcb, files = S.banks[cur] || [], imgs = files.filter(f => f.kind === 'image').length, banks = files.length - imgs;
  const sum = S.pcbs.map(p => { const a = S.banks[p.id] || [], im = a.filter(f => f.kind === 'image').length;
    return `<tr class="click ${p.id === cur ? 'sel' : ''}" data-pcb="${esc(p.id)}" onclick="setBankPcb(this.dataset.pcb)"><td>${pcbTag(p.id)}</td><td>공개 Memory Bank ${S.model.active} <span class="muted small">(Industrial PatchCore)</span></td><td>${im}장</td><td>${a.length - im}개</td><td>${a.length ? '<span class="pill orange">자체 데이터 있음 · 학습 연결 예정</span>' : '<span class="pill green">공개 뱅크 사용 중</span>'}</td></tr>`; }).join('');
  const kindPill = f => f.kind === 'image' ? '<span class="pill green">정상 이미지</span>' : '<span class="pill">Memory Bank 파일</span>';
  const upload = adm ? `<div class="drop dz" role="button" tabindex="0" onclick="document.getElementById('bankInput').click()" onkeydown="if(event.key==='Enter')document.getElementById('bankInput').click()" ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event,'bank')">${ic('upload', 'lg')}<div class="mt6"><b>${esc(cur)} 데이터뱅크 파일을 끌어다 놓거나 클릭해서 선택</b></div><div class="small dz-note">정상 PCB 사진(PNG · JPG …) 또는 Memory Bank 파일(.zip · .npy · .pt · .pth · .ckpt · .faiss · .pkl · .bin · .json) · 여러 개 동시 선택 가능</div></div>`
    : `<div class="mode-note">${ic('lock', 'lg')}<span><b>조회 전용</b> — 데이터뱅크 업로드·삭제는 관리자만 할 수 있습니다.</span></div>`;
  return `<div class="card"><div class="card-title">${ic('db', 'lg')}PCB 종류별 데이터뱅크<span class="pill">시연</span></div>
      <div class="muted small mb10">PCB 종류마다 <b>정상 기준 이미지</b>나 <b>Memory Bank 파일</b>을 모아 두는 곳입니다. 지금의 검사는 외부 PatchCore API의 공개 Memory Bank를 사용하며, 여기에 올린 자체 데이터는 이후 자체 모델(Custom PatchCore) 학습·기준 데이터로 연결할 예정입니다.</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>PCB 종류</th><th>현재 적용 기준</th><th>정상 이미지</th><th>뱅크 파일</th><th>상태</th></tr></thead><tbody>${sum}</tbody></table></div>
      <div class="divider"></div>
      <div class="row mb10"><b>${pcbTag(cur)} 데이터뱅크</b><span class="muted small">정상 이미지 ${imgs}장 · 뱅크 파일 ${banks}개</span><span class="sp"></span>
        <select class="inp" style="width:auto" aria-label="데이터뱅크 PCB 종류" onchange="setBankPcb(this.value)">${S.pcbs.map(p => `<option ${p.id === cur ? 'selected' : ''}>${esc(p.id)}</option>`).join('')}</select></div>
      ${upload}
      <div class="bk-list mt10">${files.length ? files.map(f => `<div class="bk-row"><div class="bk-ico">${f.src ? `<img src="${f.src}" alt="">` : ic('db')}</div><div style="flex:1;min-width:0"><b class="qname" title="${esc(f.name)}">${esc(f.name)}</b><div class="small muted">${fmtBytes(f.size)} · ${mdhm(f.at)}</div></div>${kindPill(f)}${adm ? `<button class="icon-btn" data-pcb="${esc(cur)}" data-fid="${f.id}" onclick="bankDelete(this.dataset.pcb,this.dataset.fid)" aria-label="삭제" title="삭제">${ic('x')}</button>` : ''}</div>`).join('') : `<div class="empty">${esc(cur)}에 올린 자체 데이터뱅크 파일이 없습니다.<br>공개 Memory Bank(${S.model.active})를 사용 중입니다.</div>`}</div>
      <div class="note">시연에서는 파일을 서버로 보내지 않고 브라우저 메모리에만 보관합니다(새로고침하면 사라짐). 실서비스는 서버 스토리지(/storage/banks/{PCB 종류}/)에 저장하고 pcb_banks 테이블에 기록합니다. 학습 연결은 후속 확장(자체 Memory Bank)입니다.</div></div>`;
}

// 시작 시 검사 대기열에 샘플 이미지 1장을 넣어 두어, 바로 '검사 시작'을 눌러 볼 수 있게 한다.
U.queue.push(newQueueItem({ ...sampleItem(SAMPLE_NORM[0]), name: '샘플 촬영 이미지' }));

/* ═══════════════════════════════════════════════════════════════════════════
   7. [메뉴 3] 검사 관리 — 검사원 최종 판정 · 판정 사유 · 피드백 + (관리자) AI 판단 근거
   ═══════════════════════════════════════════════════════════════════════════ */
/**
 * 검사 관리 화면으로 이동해 특정 검사를 선택한다.
 * @param {number} n 검사 번호
 */
function openReview(n) { closeModal(); U.rvSel = n; U.rvMemo = ''; U.evMode = 'orig'; U.dbDef = 0; U.dbZ = 1; U.rvFilter = 'all'; U.rvQ = ''; go('review'); }

/** 검사 관리 목록에서 항목을 선택한다(메모·근거 모드·의심 위치·확대 초기화). @param {number} n 검사 번호 */
function rvSelect(n) { U.rvSel = n; U.rvMemo = ''; U.evMode = 'orig'; U.dbDef = 0; U.dbZ = 1; render(); }

/**
 * 이상 의심 영역 박스를 만든다(모든 역할 공통). 위치는 시연용 시뮬레이션이며, 실서비스에서는 PatchCore 응답의 영역 좌표를 쓴다.
 * 이미지 박스(position:relative) 안에 넣어 쓰며, 정상 판정이면 빈 문자열이다.
 * @param {object} r 검사 레코드
 * @param {boolean} [small] true면 라벨 없이 얇은 박스(썸네일용)
 * @returns {string} 박스 HTML
 */
function markerHtml(r, small) {
  if (!r || r.ai !== 'ANOMALY') return '';
  let bs = r.boxes && r.boxes.length ? r.boxes : (r.spot ? [{ x: r.spot.x - r.spot.r * 1.1, y: r.spot.y - r.spot.r * 1.45, w: r.spot.r * 2.2, h: r.spot.r * 2.9 }] : []);
  return bs.map((q, i) => {
    const w = Math.min(100, Math.max(q.w + 2.4, 5)), h = Math.min(100, Math.max(q.h + 2.4, 5));
    const l = Math.max(0, Math.min(100 - w, q.x + q.w / 2 - w / 2)), t = Math.max(0, Math.min(100 - h, q.y + q.h / 2 - h / 2));
    const lab = i || small ? '' : `<i${t < 12 ? ' style="bottom:auto;top:100%;margin:2px 0 0"' : ''}>의심 영역 · ${r.score.toFixed(2)}${bs.length > 1 ? ` 외 ${bs.length - 1}곳` : ''}</i>`;
    return `<div class="mk ${small ? 'sm' : ''}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%">${lab}</div>`;
  }).join('');
}

/** 의심 영역 표시 켜기/끄기 버튼(검사 관리·확대 뷰어). */
function markBtn() { return `<button class="btn sm outline mk-btn ${U.mkOff ? 'off' : ''}" onclick="toggleMark()" aria-pressed="${!U.mkOff}" title="이미지 위 이상 의심 영역 박스를 켜고 끕니다"><span class="mk-dot"></span>의심 영역 표시 ${U.mkOff ? '꺼짐' : '켜짐'}</button>`; }

/** 의심 영역 표시를 켜고 끈다(화면 전체에 적용). */
function toggleMark() {
  U.mkOff = !U.mkOff; document.body.classList.toggle('mk-off', !!U.mkOff);
  document.querySelectorAll('.mk-btn').forEach(b => { b.classList.toggle('off', !!U.mkOff); b.setAttribute('aria-pressed', String(!U.mkOff)); b.lastChild.textContent = '의심 영역 표시 ' + (U.mkOff ? '꺼짐' : '켜짐'); });
}

/**
 * AI 판단 근거 오버레이(Heatmap · Mask · Overlay)를 생성한다 — 관리자 전용 시뮬레이션.
 * @param {object} r 검사 레코드
 * @param {string} mode 'orig' | 'heat' | 'mask' | 'overlay'
 * @param {number} op 불투명도(0~100)
 * @returns {string} 오버레이 HTML (이미지 박스 내부에 삽입)
 */
function evidenceLayer(r, mode, op) {
  if (r.ai !== 'ANOMALY' || mode === 'orig') return '';
  const { x, y, r: rad } = r.spot, a = (op / 100).toFixed(2);
  if (mode === 'heat') return `<div class="ov" style="opacity:${a};background:radial-gradient(circle at ${x}% ${y}%, rgba(239,68,68,.95) 0, rgba(249,115,22,.75) ${rad * .45}%, rgba(234,179,8,.4) ${rad * .8}%, rgba(34,197,94,0) ${rad * 1.3}%)"></div>`;
  if (mode === 'mask') return `<div class="ov" style="background:#000"></div><div class="ov" style="background:radial-gradient(ellipse ${rad}% ${rad * 1.3}% at ${x}% ${y}%, #fff 0, #fff 92%, #000 100%)"></div>`;
  return `<div class="ov" style="opacity:${a};background:radial-gradient(ellipse ${rad}% ${rad * 1.3}% at ${x}% ${y}%, rgba(239,68,68,.5) 0, rgba(239,68,68,.5) 90%, rgba(239,68,68,0) 100%)"></div>
    <div class="ov" style="opacity:${a}"><div style="position:absolute;left:${x - rad * 1.1}%;top:${y - rad * 1.45}%;width:${rad * 2.2}%;height:${rad * 2.9}%;border:2px solid #ef4444;border-radius:4px"></div></div>`;
}

/** 검사 관리 목록의 상태 필터: 전체 · 검토 대기 · 검토 완료 · (최종) 정상 · (최종) 불량. */
const RV_FILTERS = { all: () => true, pending: r => r.final === null, done: r => r.final !== null, normal: r => r.final === 'NORMAL', defect: r => r.final === 'DEFECT' };

/**
 * 검색어가 검사 레코드와 맞는지 본다 — 검사 ID(INS-000120) · 번호(120) · 판정 사유 메모 · 이미지 출처 이름을 대소문자 구분 없이 부분 일치로 찾는다.
 * @param {object} r 검사 레코드
 * @param {string} q 검색어(빈 값이면 모두 일치)
 * @returns {boolean} 일치 여부
 */
function rvMatch(r, q) {
  const s = (q || '').trim().toLowerCase(); if (!s) return true;
  const num = s.replace(/^ins-?/, '').replace(/^0+(?=\d)/, '');
  return r.id.toLowerCase().includes(s) || (/^\d+$/.test(num) && String(r.n).includes(num)) || (r.memo || '').toLowerCase().includes(s) || srcOf(r).short.toLowerCase().includes(s);
}

/** 상태 필터 칩 HTML. 칩의 건수는 현재 검색어를 적용한 결과 기준이다. */
function rvChipsHtml() {
  const base = S.inspections.filter(r => rvMatch(r, U.rvQ)), cnt = id => base.filter(RV_FILTERS[id]).length;
  const chip = (id, label, cls) => `<button class="pill ${U.rvFilter === id ? 'active' : cls}" aria-pressed="${U.rvFilter === id}" onclick="U.rvFilter='${id}';render()">${label} <b>${cnt(id)}</b></button>`;
  return chip('all', '전체', '') + chip('pending', '검토 대기', 'orange') + chip('done', '검토 완료', 'green') + '<span class="rv-sep"></span>' + chip('normal', '정상', 'green') + chip('defect', '불량', 'red');
}

/** 목록 위의 결과 건수 문구. @param {number} total 조건에 맞는 전체 건수 @param {number} shown 화면에 보이는 건수(최대 60) */
function rvCountHtml(total, shown) {
  const q = (U.rvQ || '').trim();
  return `${q ? `‘${esc(q)}’ 검색 결과 ` : ''}<b>${total}</b>건${total > shown ? ` · 상위 ${shown}건만 표시 — 검색어를 더 구체적으로 입력하세요` : ''}`;
}

/**
 * 검색어를 바꾼다. 입력 중에는 화면 전체를 다시 그리지 않고 칩 · 건수 · 목록 · 상세만 갈아 끼워 입력 커서와 한글 조합이 끊기지 않게 한다.
 * @param {string} q 검색어
 * @param {boolean} [full] true면 화면 전체를 다시 그린다(지우기 버튼)
 */
function rvSearch(q, full) {
  U.rvQ = q; const prev = U.rvSel;
  if (full || !document.getElementById('rvCard')) { render(); const el = document.getElementById('rvSearch'); if (el) el.focus(); return; }
  const t = document.createElement('div'); t.innerHTML = viewReview();
  if (U.rvSel !== prev) { U.rvMemo = ''; U.evMode = 'orig'; U.dbDef = 0; U.dbZ = 1; t.innerHTML = viewReview(); }   // 선택 건이 바뀌면 작성 중이던 메모·근거·확대 초기화
  ['rvChips', 'rvCount', 'rvList', 'rvCard'].forEach(id => { const n = document.getElementById(id), s = t.querySelector('#' + id); if (n && s) n.innerHTML = s.innerHTML; });
}

/** 검색창에서 Enter: 목록의 첫 번째 검사를 선택한다. */
function rvFirst() { const el = document.querySelector('#rvList .rv-item'); if (el) el.click(); }

/** 검색어와 상태 필터를 모두 초기화한다. */
function rvReset() { U.rvQ = ''; U.rvFilter = 'all'; render(); }

/**
 * 검사 관리 화면을 생성한다 — 왼쪽 검색·필터·목록 + 오른쪽 불량 검토 작업대 통합
 * (기판 이미지 · 의심 위치 점/말풍선 · 의심 목록 카드 · 확대/축소 · 불량 상세 · 최종 판정/메모 · 관리자 AI 판단 근거).
 * @returns {string} 본문 HTML
 */
function viewReview() {
  const st = getStats();
  const hits = S.inspections.filter(r => (RV_FILTERS[U.rvFilter] || RV_FILTERS.all)(r) && rvMatch(r, U.rvQ)).sort((a, b) => (a.final === null ? 0 : 1) - (b.final === null ? 0 : 1) || b.n - a.n);
  const list = hits.slice(0, 60);
  if (!list.find(r => r.n === U.rvSel)) U.rvSel = list.length ? list[0].n : null;
  const cur = S.inspections.find(r => r.n === U.rvSel);
  let detail = `<div class="empty">${ic('check')}검토할 항목이 없습니다.<br><span class="small muted">검색어나 필터 조건을 조정해 보세요.</span></div>`;
  if (cur) {
    const f = finalState(cur), anom = cur.ai === 'ANOMALY';
    const pts = dbPoints(cur), sel = Math.min(U.dbDef || 0, Math.max(0, pts.length - 1)), sp = pts[sel], z = U.dbZ || 1;
    const pos = p => ({ x: 50 + (p.x - 50) * z, y: 50 + (p.y - 50) * z });
    const vis = p => { const q = pos(p); return q.x >= 0 && q.x <= 100 && q.y >= 0 && q.y <= 100; };
    const sev = dbSeverity(cur);
    const dots = pts.map((p, i) => {
      const q = pos(p);
      return vis(p) ? `<button class="db-dot ${i === sel ? 'sel' : (i % 2 ? 'c2' : 'c1')}" style="left:${q.x}%;top:${q.y}%" onclick="dbDef(${i})" aria-label="의심 #${i + 1} ${esc(p.k)}"></button>` : '';
    }).join('');
    const qsp = sp ? pos(sp) : null;
    const callCls = qsp ? ((qsp.x < 34 ? ' flip-x' : '') + (qsp.y < 28 ? ' flip-y' : '')) : '';
    const call = sp && vis(sp) ? `<div class="db-call${callCls}" style="left:${qsp.x}%;top:${qsp.y}%">${esc(sp.k)} · ${cur.score.toFixed(2)}</div>` : '';
    const zbg = sp ? `background-image:url('${cur.img}');background-size:340%;background-position:${sp.x}% ${sp.y}%;` : `background-image:url('${cur.img}');background-size:cover;background-position:center;`;

    const modes = [['orig', '원본'], ['heat', 'Heatmap'], ['mask', 'Mask'], ['overlay', 'Overlay']];
    const evidence = isAdmin() ? `
      <div class="rv-ev">
        <div class="rv-sec-t">${ic('scan')}AI 판단 근거 <span class="pill role-admin">관리자 전용</span></div>
        <div class="row mb10">${modes.map(([k, l]) => `<button class="pill ${U.evMode === k ? 'active' : ''}" onclick="U.evMode='${k}';render()">${l}</button>`).join('')}
          <label class="small muted" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px">투명도 <input type="range" min="20" max="100" value="${U.evOpacity}" oninput="U.evOpacity=+this.value;document.getElementById('evLayer').innerHTML=evidenceLayer(S.inspections.find(r=>r.n===U.rvSel),U.evMode,U.evOpacity)"></label></div>
        <div class="photo zoomable" title="클릭하면 크게 볼 수 있습니다(선택한 판단 근거 포함)" onclick="openViewer(${cur.n})"><img src="${cur.img}" alt="AI 판단 근거 원본" style="${U.evMode === 'mask' && anom ? 'visibility:hidden' : ''}"><div id="evLayer">${evidenceLayer(cur, U.evMode, U.evOpacity)}</div>${U.evMode === 'orig' ? markerHtml(cur) : ''}<span class="zoom-hint">${ic('zoom')}확대</span></div>
        <div class="note">${anom ? 'AI가 어떤 영역을 근거로 이상으로 판단했는지 보여주는 자료입니다 (시안: 샘플 이미지는 데이터셋 정답 위치, 그 외는 시뮬레이션).' : 'AI 정상 판정 — 표시할 이상 영역이 없습니다.'} 실제 Heatmap · Mask · Overlay는 API 확장 이후 연동됩니다.</div>
      </div>`
      : `<div class="rv-ev"><div class="locked">${ic('lock', 'lg')}<div><b>AI 판단 근거(Heatmap · Mask · Overlay)</b><br>관리자 전용 화면에서 제공됩니다. 검사원은 점수와 원본 이미지 · 의심 위치로 판정합니다.</div></div></div>`;

    detail = `
      <div class="rv-bar">
        <span class="rv-bar-id">${cur.id}</span>
        ${pcbTag(cur.pcb)}
        <span class="small muted">PatchCore ${esc(cur.ver)}</span>
        <span class="rv-bar-sp"></span>
        <span class="db-st ${anom ? 'bad' : 'ok'}"><i></i>AI 판정: ${anom ? '이상 의심' : '정상'}</span>
        ${finalBadge(cur)}
      </div>

      <div class="db-board">
        <div class="db-wrap">
          <div class="db-img zoomable" role="button" tabindex="0" title="클릭하면 전체 화면 확대 뷰어로 봅니다" onclick="openViewer(${cur.n})" onkeydown="if(event.key==='Enter')openViewer(${cur.n})">
            <div class="db-in" style="transform:scale(${z})"><img src="${cur.img}" alt="${cur.id} 원본 이미지">${markerHtml(cur, true)}</div>
          </div>
          ${dots}${call}
        </div>
        <div class="db-list" role="group" aria-label="이상 의심 위치 목록">
          <div class="db-list-hd">의심 위치 목록 ${pts.length ? `(${pts.length})` : ''}</div>
          ${pts.length ? pts.map((p, i) => `<button class="${i === sel ? 'on' : ''}" onclick="dbDef(${i})">${i === sel ? '<i></i>' : ''}의심 #${i + 1}: ${esc(p.k)}</button>`).join('') : '<div class="none">이상 의심 영역이 없습니다 (AI 정상)</div>'}
        </div>
        <div class="db-zoom">
          <button onclick="dbZoom(.5)" ${z >= 2.5 ? 'disabled' : ''} aria-label="확대" title="확대">${ic('plus')}</button>
          <button onclick="dbZoom(-.5)" ${z <= 1 ? 'disabled' : ''} aria-label="축소" title="축소">${ic('minus')}</button>
          ${z > 1 ? `<button onclick="dbZoomReset()" aria-label="원래 크기" title="100% 맞춤">${Math.round(z * 100)}%</button>` : ''}
        </div>
      </div>

      <div class="rv-canvas-tools">
        <button class="btn sm" onclick="openViewer(${cur.n})">${ic('zoom')}확대 보기</button>
        <button class="btn sm outline" onclick="downloadImage(${cur.n})">${ic('download')}다운로드</button>
        ${anom ? markBtn() : ''}
        <span class="small muted" style="margin-left:auto">배율 ${Math.round(z * 100)}% · 출처 ${esc(srcOf(cur).short)}</span>
      </div>
      ${anom ? `<div class="small mt6" style="color:var(--bad)">빨간 박스 · 의심 점: AI 이상 의심 영역${cur.boxes && cur.boxes.length && cur.boxes[0].k ? ` · 데이터셋 정답 유형(참고): ${KIND_KO[cur.boxes[0].k] || cur.boxes[0].k}${cur.boxes.length > 1 ? ` 외 ${cur.boxes.length - 1}곳` : ''}` : ' (시연용 위치)'}</div>` : ''}

      <div class="rv-subgrid">
        <div>
          <div class="rv-sec-t">${ic('alert')}불량 상세 정보</div>
          <div class="db-kv">
            <div><span class="k">유형</span> <span class="${anom ? 'red' : ''}">${anom ? esc(sp ? sp.k : '이상 의심') : '이상 없음'}</span></div>
            <div><span class="k">PCB 종류</span> ${pcbTag(cur.pcb)} <span class="small muted">· ${esc(cur.ver)}</span></div>
            <div><span class="k">좌표</span> ${sp ? `<b>X: ${Math.round(sp.x)}%, Y: ${Math.round(sp.y)}%</b>` : '—'}</div>
            <div><span class="k">AI 점수</span> <span class="sc"><b>${cur.score.toFixed(2)}</b><i class="${cur.score >= cur.thr ? 'hi' : ''}"><b style="width:${Math.min(100, Math.round(cur.score * 100))}%"></b></i></span> <span class="small muted">(임계값 ${cur.thr.toFixed(2)})</span></div>
            <div><span class="k">확대 이미지</span> <span class="small muted">${sp ? `X: ${Math.round(sp.x)}%, Y: ${Math.round(sp.y)}% 중심` : '전체 기판'}</span>
              <div class="db-zimg" style="${zbg}" role="button" tabindex="0" onclick="openViewer(${cur.n})" onkeydown="if(event.key==='Enter')openViewer(${cur.n})" title="클릭하면 확대 뷰어로 봅니다"></div>
            </div>
            <div><span class="k">심각도</span> <span class="sev"><i style="background:${sev[0]}"></i>${sev[1]}</span></div>
            <div><span class="k">이력</span> ${mdhm(cur.at)} 검사 · ${cur.ms}ms · ${finalBadge(cur)}
              <div class="small muted mt4">${esc(srcOf(cur).full)}</div>
            </div>
          </div>
        </div>

        <div>
          <div class="rv-sec-t">${ic('check')}검사원 최종 판정</div>
          <div class="rv-act-btns">
            <button class="btn primary" onclick="submitReview(${cur.n},'NORMAL')">${ic('check')}정상 확정</button>
            <button class="btn danger" onclick="submitReview(${cur.n},'DEFECT')">${ic('x')}불량 확정</button>
          </div>
          <div class="field mt12">
            <label for="rvMemo">판정 사유 및 검사원 메모</label>
            <textarea class="inp" id="rvMemo" style="min-height:142px" placeholder="판정 사유를 입력하는 영역 (정상 확정 시 가불량 사유, 불량 확정 시 불량 내용)" oninput="U.rvMemo=this.value">${esc(U.rvMemo || cur.memo)}</textarea>
          </div>
          <div class="note">${f === 'PENDING' ? '확정하면 다음 검토 대기 건으로 자동 이동합니다. ' : '이미 확정된 건입니다. 다시 누르면 최종 판정을 변경하며, AI 최초 판정은 그대로 보존됩니다. '}확정 판정과 사유는 피드백 데이터로 누적되어 추후 자체 모델(Custom PatchCore) 학습에 활용됩니다.</div>
        </div>
      </div>
      ${evidence}`;
  }
  return `${pageHead('검사 관리', '이상 의심 건 상세 검토 · 최종 판정 · 사유 기록', `<span class="pill orange lg">${st.pending}건 대기</span>`)}
    <div class="rv-tools"><div class="rv-search"><input class="inp" id="rvSearch" type="text" autocomplete="off" placeholder="ID · 번호 · 메모 · 출처 검색 (예: INS-000120)" aria-label="검사 검색" value="${esc(U.rvQ)}" oninput="rvSearch(this.value)" onkeydown="if(event.key==='Enter')rvFirst()"><button class="icon-btn x" onclick="rvSearch('', true)" aria-label="검색어 지우기" title="검색어 지우기">${ic('x')}</button></div><div class="rv-chips" id="rvChips">${rvChipsHtml()}</div></div>
    <div class="split rv">
      <div><div class="small muted rv-count" id="rvCount">${rvCountHtml(hits.length, list.length)}</div><div class="rv-list" id="rvList">${list.map(r => `<button class="rv-item ${r.n === U.rvSel ? 'sel' : ''}" onclick="rvSelect(${r.n})"><div class="thumb" style="${thumbStyle(r)}"></div><div style="flex:1;min-width:0"><div class="rv-h"><span class="t">${r.id}</span>${finalBadge(r)}</div><div class="small muted">${pcbTag(r.pcb)} · 점수 <b>${r.score.toFixed(2)}</b> · ${hhmm(r.at)}</div><div class="mt4"><span class="srctag" title="${esc(srcOf(r).full)}">출처 ${esc(srcOf(r).short)}</span></div></div></button>`).join('') || '<div class="empty">조건에 맞는 검사가 없습니다.<br><button class="btn sm outline mt10" onclick="rvReset()">검색·필터 초기화</button></div>'}</div></div>
      <div class="card" id="rvCard">${detail}</div></div>`;
}

/**
 * 검사원 최종 판정을 저장한다. AI 최초 판정(ai·score)은 변경하지 않고 final·memo만 기록한다.
 * @param {number} n 검사 번호
 * @param {'NORMAL'|'DEFECT'} decision 최종 판정
 */
function submitReview(n, decision) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  const memo = (document.getElementById('rvMemo') || { value: '' }).value.trim();
  const wasPending = r.final === null; r.final = decision; r.memo = memo; U.rvMemo = '';
  const rescue = r.ai === 'ANOMALY' && decision === 'NORMAL';
  toast(`${r.id} ${decision === 'NORMAL' ? '정상' : '불량'} 확정${rescue ? ' (가불량 구제)' : ''}${decision === 'DEFECT' && !memo ? ' · 사유 미입력' : ''}`);
  if (wasPending) { const next = S.inspections.filter(x => x.final === null).sort((a, b) => b.n - a.n)[0]; U.rvSel = next ? next.n : r.n; U.dbDef = 0; U.dbZ = 1; }
  render();
}

/* ═══════════════════════════════════════════════════════════════════════════
   8. [메뉴 4] 검사 이력 — 결과 조회 · 검색 · 이미지 및 CSV 다운로드
   ═══════════════════════════════════════════════════════════════════════════ */
/**
 * 현재 필터(기간·PCB·결과·검색어)에 맞는 검사 목록을 반환한다.
 * @returns {object[]} 번호 내림차순 검사 레코드
 */
function filteredHistory() {
  const f = U.hf;
  return S.inspections.filter(r => {
    const h = new Date(r.at).getHours();
    if (f.period === 'am' && h >= 12) return false;
    if (f.period === 'pm' && (h < 12 || h >= 18)) return false;
    if (f.period === 'eve' && h < 18) return false;
    if (f.hour != null && h !== f.hour) return false;
    if (f.pcb !== 'all' && r.pcb !== f.pcb) return false;
    if (f.result !== 'all' && finalState(r) !== f.result) return false;
    if (f.q && !(r.id.toLowerCase().includes(f.q.toLowerCase()) || String(r.n) === f.q.trim())) return false;
    return true;
  }).sort((a, b) => b.n - a.n);
}

/**
 * 검사 이력 화면을 생성한다 (10건 단위 페이징).
 * @returns {string} 본문 HTML
 */
function viewHistory() {
  const st = getStats(), all = filteredHistory(), per = 10, pages = Math.max(1, Math.ceil(all.length / per));
  U.hpage = Math.min(U.hpage, pages); const rows = all.slice((U.hpage - 1) * per, U.hpage * per);
  const sel = (key, opts) => `<select class="inp" aria-label="${opts[0][1].split(':')[0]}" onchange="U.hf.${key}=this.value;U.hpage=1;render()">${opts.map(([v, l]) => `<option value="${v}" ${U.hf[key] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `${pageHead('검사 이력', '결과 조회 · 검색 · 이미지 및 CSV 다운로드', `
      <span class="pill green">정상 ${st.normal}</span>
      <span class="pill red">불량 ${st.defect}</span>
      <span class="pill orange">대기 ${st.pending}</span>
      <button class="btn sm outline" onclick="exportCsv()">${ic('download')}CSV 다운로드</button>
    `)}
    <div class="card"><div class="hist-bar">
      ${sel('period', [['all', '기간: 전체'], ['am', '기간: 오전'], ['pm', '기간: 오후'], ['eve', '기간: 저녁']])}
      ${sel('pcb', [['all', 'PCB 종류: 전체'], ...S.pcbs.map(p => [p.id, 'PCB 종류: ' + p.id])])}
      ${sel('result', [['all', '결과: 전체'], ['NORMAL', '결과: 정상'], ['DEFECT', '결과: 불량'], ['PENDING', '결과: 검토 대기']])}
      <input class="inp" style="min-width:170px" placeholder="검사 ID · 번호 검색" aria-label="검사 ID 또는 번호 검색" value="${esc(U.hf.q)}" onchange="U.hf.q=this.value;U.hpage=1;render()">
      ${U.hf.hour != null ? `<button class="pill active" onclick="U.hf.hour=null;U.hpage=1;render()" title="시간 필터 해제">${U.hf.hour}시대 ✕</button>` : ''}
      <span class="pill" style="margin-left:auto">조회 <b>${all.length}</b>건</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>검사 ID</th><th>PCB 종류</th><th>AI 점수</th><th>AI 판정</th><th>최종 판정</th><th>검사 시각</th>${isAdmin() ? '<th>당시 임계값</th><th>모델</th>' : ''}</tr></thead><tbody>
      ${rows.map(r => `<tr class="click ${r.ai === 'ANOMALY' ? 'anom' : ''}" onclick="openDetail(${r.n})"><td><b>${r.id}</b></td><td>${pcbTag(r.pcb)}</td><td><span class="sc"><b>${r.score.toFixed(2)}</b><i class="${r.score >= r.thr ? 'hi' : ''}"><b style="width:${Math.min(100, Math.round(r.score * 100))}%"></b></i></span></td><td>${aiBadge(r.ai)}</td><td>${finalBadge(r)}</td><td>${mdhm(r.at)}</td>${isAdmin() ? `<td>${r.thr.toFixed(2)}</td><td>${r.ver}</td>` : ''}</tr>`).join('') || `<tr><td colspan="${isAdmin() ? 8 : 6}" class="empty">${ic('history')}조건에 맞는 검사가 없습니다.<br><button class="btn sm outline mt10" onclick="U.hf={period:'all',pcb:'all',result:'all',q:''};U.hpage=1;render()">필터 초기화</button></td></tr>`}</tbody></table></div>
      <div class="pager"><button class="btn sm outline" ${U.hpage <= 1 ? 'disabled' : ''} onclick="U.hpage--;render()">이전</button><span class="small muted">${U.hpage} / ${pages} 페이지</span><button class="btn sm outline" ${U.hpage >= pages ? 'disabled' : ''} onclick="U.hpage++;render()">다음</button></div>
    </div>`;
}

/**
 * 검사 상세 모달을 연다 (검사 당시 임계값·모델 버전 스냅샷 포함).
 * @param {number} n 검사 번호
 */
function openDetail(n) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  openModal(`<div class="row between"><b style="font-size:18px">${r.id}</b><button class="icon-btn" onclick="closeModal()" aria-label="닫기">${ic('x')}</button></div>
    <div class="photo zoomable" style="margin:12px 0" title="클릭하면 크게 볼 수 있습니다" onclick="openViewer(${r.n})"><img src="${r.img}" alt="${r.id}">${markerHtml(r)}<span class="zoom-hint">${ic('zoom')}확대</span></div>
    <dl class="kv"><dt>PCB 종류 / 모델</dt><dd>${pcbTag(r.pcb)} · Industrial PatchCore ${r.ver}</dd><dt>이미지 출처</dt><dd>${esc(srcOf(r).full)}</dd><dt>검사 시각</dt><dd>${mdhm(r.at)} · 처리 ${r.ms}ms</dd>
      <dt>AI 점수</dt><dd>${r.score.toFixed(2)} (당시 임계값 ${r.thr.toFixed(2)})</dd><dt>AI 판정</dt><dd>${aiBadge(r.ai)}</dd><dt>최종 판정</dt><dd>${finalBadge(r)}</dd><dt>판정 사유</dt><dd>${esc(r.memo) || '<span class="muted">—</span>'}</dd></dl>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn outline" onclick="downloadImage(${r.n})">${ic('download')}이미지 다운로드</button><button class="btn primary" onclick="openReview(${r.n})">검사 관리에서 열기</button></div>`);
}

/**
 * CSV 셀 값을 RFC 4180 규칙으로 이스케이프한다.
 * @param {*} v 셀 값
 * @returns {string} 이스케이프된 문자열
 */
function csvCell(v) { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

/**
 * 검사 이력을 CSV(UTF-8 BOM)로 내려받는다.
 * @param {boolean} [all] true 이면 필터와 무관하게 전체 이력 (데이터 관리 화면)
 */
function exportCsv(all) {
  const head = ['번호', '검사ID', 'PCB', '검사시각', 'AI점수', 'AI판정', '최종판정', '당시임계값', '모델버전', '판정사유'];
  const rows = (all === true ? [...S.inspections].sort((a, b) => a.n - b.n) : filteredHistory()).map(r => [r.n, r.id, r.pcb, mdhm(r.at), r.score.toFixed(2), r.ai === 'ANOMALY' ? '이상' : '정상', { PENDING: '검토 대기', NORMAL: '정상', DEFECT: '불량' }[finalState(r)], r.thr.toFixed(2), r.ver, r.memo]);
  const csv = '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'CircuitEye_검사이력_20261120.csv'; document.body.appendChild(a); a.click(); a.remove(); toast(`CSV ${rows.length}건 다운로드`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   8-2. [메뉴 5] 통계 분석 — 기간별 추이 · 불량 유형 분포 · TOP 5 (시연용 합성 이력 포함)
   ═══════════════════════════════════════════════════════════════════════════ */
/** 불량 유형 분류 체계 — 샘플 이미지의 데이터셋 정답 라벨(PKU-Market-PCB)을 쓴다. 실제 API는 유형을 반환하지 않으므로 서비스에서는 검사원 분류 입력(후속 확장)이 이 값을 대신한다. */
const DEFECT_TYPES = [
  { id: 'open', c: '#8e5bb5' }, { id: 'short', c: '#3aa38a' }, { id: 'mousebite', c: '#b5651d' }, { id: 'spur', c: '#7a8a99' },
  { id: 'copper', c: '#c76f9a' }, { id: 'missing_hole', c: '#2f8f9d' }, { id: '', c: '#9aa3a0' }
].map(t => ({ ...t, k: t.id ? KIND_KO[t.id] : '미분류' }));
/** 최근 6일 합성 이력 [검사 건수, 불량 건수] (시연용 고정값) + 오늘은 실제 집계 */
const PAST_DAYS = [[104, 9], [118, 11], [97, 8], [126, 12], [112, 10], [109, 9]];

/**
 * 검사 레코드의 불량 유형 id를 돌려준다(이미지의 정답 라벨). 라벨이 없는 업로드 이미지는 '' (미분류).
 * @param {object} r 검사 레코드
 * @returns {string} 유형 id
 */
function defectTypeOf(r) { return (r.boxes && r.boxes[0] && r.boxes[0].k) || ''; }

/**
 * 통계 분석용 집계를 만든다 (기간 7/14일 중 선택, 일별 추이의 과거 일자는 시연용 합성).
 * 불량 유형 분포는 합성 없이 현재 검사 이력(불량 확정 + 검토 대기)의 실제 이미지 라벨로 집계한다.
 * @param {number} days 기간(일)
 * @returns {object} 일별 · 유형별 집계
 */
function statsData(days) {
  const st = getStats();
  const labels = [], tot = [], bad = [];
  const past = pastDailySeries(Math.max(1, days - 1));   // 시연용: 오늘 외 과거 일자 합성 이력
  const base = new Date('2026-11-20T00:00:00+09:00');
  const all = [...past, [st.total, st.defect + st.pending]];
  all.forEach(([t, d], i) => { const dt = new Date(base.getTime() - (all.length - 1 - i) * 86400000); labels.push(`${dt.getMonth() + 1}/${dt.getDate()}`); tot.push(t); bad.push(d); });
  const bads = S.inspections.filter(r => r.final !== 'NORMAL');   // 불량 확정 + 검토 대기
  const byType = DEFECT_TYPES.map(t => ({ ...t, n: bads.filter(r => defectTypeOf(r) === t.id).length })).filter(t => t.n > 0).sort((x, y) => y.n - x.n);
  return { labels, tot, bad, byType, typeTotal: bads.length, sum: tot.reduce((a, b) => a + b, 0), badSum: bad.reduce((a, b) => a + b, 0) };
}

/** 통계 기간 선택(7일/14일)을 바꾼다. */
function setStatDays(d) { U.statDays = d; render(); }

/**
 * 모든 화면이 공유하는 페이지 헤더(제목 · 부제 | 우측 액션 슬롯)를 생성한다.
 * @param {string} title 화면 제목
 * @param {string} [sub] 부제(HTML 허용)
 * @param {string} [act] 우측 액션 영역 HTML(버튼 · 배지 · 기간 토글 등)
 * @returns {string} 헤더 HTML
 */
function pageHead(title, sub, act) {
  return `<div class="page-head"><div><h1 class="page-title">${title}</h1>${sub ? `<p class="page-sub">${sub}</p>` : ''}</div>${act ? `<div class="page-act">${act}</div>` : ''}</div>`;
}

/**
 * 차트 수치를 접근 가능한 데이터 표로 제공한다(화면 낭독기 · 정확한 값 확인용, 기본은 접힘).
 * @param {string[]} head 열 제목
 * @param {Array<Array<string|number>>} rows 행 데이터
 * @returns {string} details 요소 HTML
 */
function chartTable(head, rows) {
  return `<details class="tbl-toggle"><summary>표로 보기</summary><table><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
}

/** 대시보드 시간대 막대 클릭: 해당 시간대의 검사 이력으로 이동한다. @param {number} hr 시(0~23) */
function gotoHour(hr) { U.hf = { period: 'all', pcb: 'all', result: 'all', q: '', hour: hr }; go('history'); }

/**
 * 다운로드 파일명을 만든다(검사 ID + 이미지 형식 확장자).
 * @param {object} r 검사 레코드
 * @returns {string} 예: INS-000120.png
 */
function dlName(r) {
  const src = r.img || '', m = /^data:image\/(\w+)/.exec(src);
  const ext = m ? (m[1] === 'jpeg' ? 'jpg' : m[1]) : ((/\.(\w{3,4})$/.exec(src) || [])[1] || 'png');
  return `${r.id}.${ext}`;
}

/**
 * 검사 이미지를 파일로 내려받는다.
 * 같은 출처(배포 주소)에서는 Blob으로 바로 저장하고, file:// 로 직접 열었을 때처럼 브라우저가 fetch·download 속성을 막으면
 * 새 탭에서 이미지를 열어 '다른 이름으로 저장'하도록 안내한다.
 * @param {number} n 검사 번호
 */
async function downloadImage(n) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  try {
    const blob = await (await fetch(r.img)).blob(), url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: dlName(r) });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast(`${dlName(r)} 저장을 시작했습니다`);
  } catch (e) {
    window.open(r.img, '_blank');
    toast('새 탭에서 이미지를 열었습니다 — 마우스 오른쪽 버튼으로 저장하세요');
  }
}

/** 확대 뷰어 상태: s=배율(1~6), x·y=이동량(px) */
const VZ = { s: 1, x: 0, y: 0 };

/** 확대 뷰어의 현재 배율·이동을 화면에 반영한다(이동은 이미지가 화면 밖으로 벗어나지 않게 제한). */
function vzApply() {
  const box = document.getElementById('vz'), inn = document.getElementById('vzIn'); if (!box || !inn) return;
  const w = box.clientWidth, hh = box.clientHeight;
  VZ.x = Math.min(0, Math.max(w - w * VZ.s, VZ.x)); VZ.y = Math.min(0, Math.max(hh - hh * VZ.s, VZ.y));
  inn.style.transform = `translate(${VZ.x}px,${VZ.y}px) scale(${VZ.s})`;
  box.classList.toggle('zoomed', VZ.s > 1);
  const pct = document.getElementById('vzPct'); if (pct) pct.textContent = Math.round(VZ.s * 100) + '%';
}

/**
 * 지정한 지점을 기준으로 확대·축소한다.
 * @param {number} f 배율 변화 비율(1.25 = 25% 확대)
 * @param {number} [cx] 기준점 x(뷰어 안 좌표, 기본 중앙)
 * @param {number} [cy] 기준점 y
 */
function vzZoom(f, cx, cy) {
  const box = document.getElementById('vz'); if (!box) return;
  cx = cx ?? box.clientWidth / 2; cy = cy ?? box.clientHeight / 2;
  const ns = Math.min(6, Math.max(1, VZ.s * f)), k = ns / VZ.s;
  VZ.x = cx - (cx - VZ.x) * k; VZ.y = cy - (cy - VZ.y) * k; VZ.s = ns; vzApply();
}

/** 확대 뷰어를 원래 크기(맞춤)로 되돌린다. */
function vzReset() { VZ.s = 1; VZ.x = 0; VZ.y = 0; vzApply(); }

/**
 * 검사 이미지를 크게 보는 뷰어를 연다 — 휠·버튼 확대/축소, 끌어서 이동, 더블클릭 확대, 다운로드.
 * 관리자가 검사 관리에서 AI 판단 근거(Heatmap·Mask·Overlay)를 선택해 둔 상태면 같은 표시를 이미지 위에 겹쳐 보여 준다.
 * @param {number} n 검사 번호
 */
function openViewer(n) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  Object.assign(VZ, { s: 1, x: 0, y: 0 });
  const ev = isAdmin() && U.evMode !== 'orig' && r.ai === 'ANOMALY';
  openModal(`<div class="row between mb8"><b style="font-size:18px">${r.id} · ${pcbTag(r.pcb)}</b><button class="icon-btn" onclick="closeModal()" aria-label="닫기">${ic('x')}</button></div>
