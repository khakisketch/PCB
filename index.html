<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircuitEye (써킷아이) — PCB 외관검사 MVP · 리디자인 v4</title>
<link rel="icon" type="image/png" href="./docs/assets/favicon.png">
<link rel="apple-touch-icon" href="./docs/assets/circuiteye_icon_256.png">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

/* ═══════════════════════════════════════════════════════════════════════════
   1. 디자인 토큰 — 라이트 / 다크 (담당자 레퍼런스: 흰 카드 · 차분한 그린 · 필(pill) 배지)
   ═══════════════════════════════════════════════════════════════════════════ */
:root, html[data-theme="light"] {
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  --bg-app: #f6f7f6; --bg-card: #ffffff; --bg-muted: #f1f2f1; --bg-hover: #ecefec; --bg-input: #ffffff;
  --border: #e4e7e4; --border-strong: #cfd4cf;
  --text-1: #141816; --text-2: #3b423d; --text-3: #6b736d;
  --primary: #46745f; --primary-hover: #3b6350; --primary-fg: #ffffff;
  --danger: #a8504a; --danger-hover: #92423d;
  --good: #2f6b3a; --warn: #8a4a1c; --bad: #c0463e;
  --b-green-bg: #e3f1e3; --b-green-fg: #2f6b3a;
  --b-orange-bg: #fbe6dc; --b-orange-fg: #a2501e;
  --b-red-bg: #fbe1de; --b-red-fg: #b23a32;
  --b-gray-bg: #f1f2f1; --b-gray-fg: #4b534d;
  --shadow: 0 1px 2px rgba(20, 24, 22, .05);
  --shadow-float: 0 18px 48px -8px rgba(20, 24, 22, .22);
  --bar-normal: #6fa384; --bar-defect: #c0463e; --bar-pending: #d49a5c;
  --role-insp: #3b7bbf; --ease: cubic-bezier(.22, .8, .3, 1);
}
html[data-theme="dark"] {
  --bg-app: #0e1210; --bg-card: #161c19; --bg-muted: #1d2521; --bg-hover: #232d28; --bg-input: #121714;
  --border: #26302b; --border-strong: #3a4740;
  --text-1: #f1f4f2; --text-2: #cdd5d0; --text-3: #92a098;
  --primary: #5b9378; --primary-hover: #6aa388; --primary-fg: #0b100d;
  --danger: #c46a63; --danger-hover: #d27b74;
  --good: #7fcf94; --warn: #e5a76c; --bad: #f08a82;
  --b-green-bg: rgba(111, 200, 140, .15); --b-green-fg: #86d69b;
  --b-orange-bg: rgba(229, 150, 90, .16); --b-orange-fg: #eba66d;
  --b-red-bg: rgba(240, 120, 110, .16); --b-red-fg: #f29a92;
  --b-gray-bg: #232d28; --b-gray-fg: #b6c1ba;
  --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-float: 0 22px 54px rgba(0, 0, 0, .6);
  --bar-normal: #5b9378; --bar-defect: #e0766d; --bar-pending: #d49a5c;
  --role-insp: #86b4e8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 14px; line-height: 1.5;
  background: var(--bg-app); color: var(--text-1); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; font-variant-numeric: tabular-nums; }
button { cursor: pointer; border: 0; background: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
.ic { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }
.ic.lg { width: 20px; height: 20px; }
.hidden { display: none !important; }

/* ═══════════════════════════════════════════════════════════════════════════
   2. 공통 컴포넌트 — 카드 · 배지 · 버튼 · 폼 · 표
   ═══════════════════════════════════════════════════════════════════════════ */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; }
.card + .card { margin-top: 14px; }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card-title .sp { flex: 1; }
.page-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
.page-sub { color: var(--text-3); margin-bottom: 16px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--b-gray-bg); color: var(--b-gray-fg); }
.pill.green { background: var(--b-green-bg); color: var(--b-green-fg); }
.pill.orange { background: var(--b-orange-bg); color: var(--b-orange-fg); }
.pill.red { background: var(--b-red-bg); color: var(--b-red-fg); }
.pill.lg { font-size: 13.5px; padding: 4px 14px; }
button.pill { cursor: pointer; border: 1px solid transparent; }
button.pill.active { background: var(--text-1); color: var(--bg-card); }
button.pill:hover:not(.active) { border-color: var(--border-strong); }
/* 버튼류 텍스트·아이콘 가운데 정렬 보정 (한 줄·여러 줄 모두) */
.btn, .pill, .icon-btn, .vw-seg button, .pager .btn { text-align: center; line-height: 1.35; text-decoration: none; }
.pill, .icon-btn { justify-content: center; }
.btn { white-space: nowrap; }
.btn.block { display: flex; }
.nav-item { text-align: left; }
.vw-seg button { display: inline-flex; align-items: center; justify-content: center; }
/* 역할 구분 — 관리자: 진한 그린 배지 · 검사원: 블루 배지 + 헤더 하단 포인트 라인 */
.pill.role-admin { background: var(--primary); color: var(--primary-fg); font-weight: 700; }
.pill.role-insp { background: color-mix(in srgb, var(--role-insp) 16%, transparent); color: var(--role-insp); font-weight: 700; }
.pill .ic { width: 13px; height: 13px; }
.shell[data-role="admin"] .topbar { box-shadow: inset 0 -3px 0 var(--primary); }
.shell[data-role="inspector"] .topbar { box-shadow: inset 0 -3px 0 var(--role-insp); }
.role-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--border); border-left-width: 5px; background: var(--bg-card); }
.role-strip.admin { border-left-color: var(--primary); }
.role-strip.insp { border-left-color: var(--role-insp); }
.role-strip .rs-t { font-weight: 800; display: flex; align-items: center; gap: 7px; }
.role-strip .rs-i { display: flex; flex-direction: column; line-height: 1.3; }
.role-strip .rs-i small { color: var(--text-3); font-size: 12px; }
.role-strip .rs-i b { font-size: 15px; }
.role-strip .rs-act { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.perm { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--bg-muted); font-size: 12.5px; line-height: 1.7; }
.perm b { display: block; margin-bottom: 2px; color: var(--text-1); }
.perm .ok { color: var(--good); } .perm .no { color: var(--text-3); }
.grid2 + .card, .split + .card { margin-top: 14px; }
.split > .card, .grid2 > .card { margin-top: 0; margin-bottom: 0; }
.nav-item .lk { margin-left: auto; color: var(--text-3); display: inline-flex; }
.nav-item .lk .ic { width: 14px; height: 14px; }
.lbl-s { display: none; }
/* 사이드바 하단 — 시스템 상태 · 계정 프로필 */
.sys-card { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--bg-muted); width: 100%; text-align: left; display: block; }
.sys-card:hover { background: var(--bg-hover); }
.sys-card .sc-t { display: block; font-weight: 700; color: var(--text-1); margin-bottom: 6px; font-size: 12.5px; }
.sys-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; line-height: 1.9; color: var(--text-2); }
.sys-row .st { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.sys-row .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.sys-row .st.off { color: var(--bad); } .sys-row .st.off i { background: var(--bad); }
.sys-row .st.ok { color: var(--good); }
.prof { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg-muted); }
.prof-top { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: #fff; font-weight: 800; font-size: 14px; }
.prof-n { min-width: 0; line-height: 1.35; }
.prof-n b { display: block; color: var(--text-1); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof-n small { display: block; color: var(--text-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof .btn { margin-top: 10px; }
@media (max-height: 900px) and (min-width: 901px) { .perm { display: none; } .side { padding-top: 14px; gap: 6px; } .sys-card, .prof { margin-top: 8px; } }
.demo-reset { margin-top: 8px; font-size: 12px; color: var(--text-3); text-align: center; width: 100%; padding: 4px; }
.demo-reset:hover { color: var(--text-1); text-decoration: underline; }
/* 통계 분석 · 데이터 관리 */
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 2; }
.legend-row i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.rank-row { display: grid; grid-template-columns: 22px 92px 1fr 70px; align-items: center; gap: 8px; padding: 7px 0; font-size: 13.5px; }
.rank-bar { height: 9px; background: var(--bg-muted); border-radius: 6px; overflow: hidden; } .rank-bar i { display: block; height: 100%; border-radius: 6px; }
.drop { border: 2px dashed var(--border); border-radius: 12px; padding: 22px; text-align: center; color: var(--text-3); background: var(--bg-muted); }
.seg-row { display: flex; gap: 6px; flex-wrap: wrap; }
/* 서버(PatchCore API) 온라인/오프라인 표시 */
button.pill.api { gap: 6px; }
button.pill.api.red .dot { animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.banner-off { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; background: var(--b-red-bg); color: var(--b-red-fg); font-weight: 600; }
.mode-note { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; background: color-mix(in srgb, var(--role-insp) 12%, transparent); color: var(--text-2); font-size: 13.5px; }
.mode-note .ic { color: var(--role-insp); }
.dragging, .dragging * { cursor: grabbing !important; user-select: none !important; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; border-radius: 10px; font-weight: 600; background: var(--bg-muted); color: var(--text-1); border: 1px solid transparent; transition: background .15s; }
.btn:hover:not(:disabled) { background: var(--bg-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); color: var(--primary-fg); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.danger:hover:not(:disabled) { background: var(--danger-hover); }
.btn.outline { background: var(--bg-card); border-color: var(--border-strong); }
.btn.block { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--text-3); }
.inp, select.inp, textarea.inp { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg-input); outline: none; }
.inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
textarea.inp { min-height: 84px; resize: vertical; line-height: 1.5; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--text-3); padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--bg-muted); }
.tbl-wrap { overflow-x: auto; }
.bar-track { height: 10px; border-radius: 6px; background: var(--bg-muted); position: relative; overflow: visible; }
.bar-fill { height: 100%; border-radius: 6px; background: #c9994f; }
.bar-fill.ok { background: var(--bar-normal); }
.bar-thr { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-1); border-radius: 1px; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }
.note { color: var(--text-3); font-size: 13px; margin-top: 10px; }
.empty { text-align: center; color: var(--text-3); padding: 28px 10px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 13.5px; }
.kv dt { color: var(--text-3); }

/* ═══════════════════════════════════════════════════════════════════════════
   3. 스플래시 · 로그인
   ═══════════════════════════════════════════════════════════════════════════ */
#splash { position: fixed; inset: 0; z-index: 90; background: var(--bg-app); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .35s; }
#splash.out { opacity: 0; pointer-events: none; }
#splash img { width: 64px; height: 64px; border-radius: 16px; }
#splash b { font-size: 20px; letter-spacing: -.02em; }
.splash-bar { width: 140px; height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; }
.splash-bar i { display: block; height: 100%; width: 0; background: var(--primary); animation: sbar .9s ease forwards; }
@keyframes sbar { to { width: 100%; } }
.login-wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 396px; }
.login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.login-brand img { width: 40px; height: 40px; border-radius: 10px; }
.login-brand b { font-size: 20px; letter-spacing: -.02em; display: block; line-height: 1.2; }
.login-brand span { font-size: 12.5px; color: var(--text-3); }

/* ═══════════════════════════════════════════════════════════════════════════
   4. 콘솔 셸 — 상단 헤더 + 좌측 8메뉴 (좁은 화면에서는 하단 탭바)
   ═══════════════════════════════════════════════════════════════════════════ */
.shell { display: flex; flex-direction: column; height: 100%; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 22px; height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border); flex: none; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.brand img { width: 28px; height: 28px; border-radius: 7px; }
.brand small { font-weight: 500; color: var(--text-3); font-size: 12.5px; margin-left: 2px; }
.top-sp { flex: 1; }
.icon-btn { flex: none; width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
.icon-btn:hover { background: var(--bg-muted); }
.body-wrap { display: flex; flex: 1; min-height: 0; }
.side { width: 220px; flex: none; padding: 18px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--bg-card); border-right: 1px solid var(--border); overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--bg-muted); color: var(--text-2); font-weight: 500; text-align: left; position: relative; }
.nav-item:hover { background: var(--bg-hover); }
.nav-item.active { color: var(--text-1); font-weight: 800; background: var(--bg-hover); box-shadow: inset 3px 0 0 var(--primary); }
.nav-item .cnt { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--b-orange-bg); color: var(--b-orange-fg); }
.side-foot { margin-top: auto; padding-top: 14px; font-size: 12.5px; color: var(--text-3); }
.main { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }
.main-inner { max-width: 1040px; margin: 0 auto; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; text-align: left; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.kpi:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.kpi .l { color: var(--text-3); font-size: 14px; }
.kpi .v { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.kpi .v.good { color: var(--good); } .kpi .v.bad { color: var(--bad); } .kpi .v.warn { color: var(--warn); }
.split { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; align-items: start; }
.split.eq { align-items: stretch; }
.photo { position: relative; width: 100%; aspect-ratio: 475 / 350; border-radius: 12px; overflow: hidden; background: #0f1512; border: 1px solid var(--border); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .ov { position: absolute; inset: 0; pointer-events: none; }
.photo .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a958e; font-size: 13px; text-align: center; padding: 16px; }
.photo.flash::after { content: ''; position: absolute; inset: 0; background: #fff; animation: flash .45s ease-out forwards; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }
.score-big { font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.thumb { width: 64px; height: 48px; border-radius: 8px; border: 1px solid var(--border); background-repeat: no-repeat; flex: none; }
.split.rv { grid-template-columns: minmax(260px, .62fr) 1.6fr; }
.rv-list { display: flex; flex-direction: column; gap: 8px; max-height: 640px; overflow-y: auto; padding-right: 2px; }
.rv-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0 12px; }
.rv-search { flex: 1 1 240px; max-width: 360px; position: relative; }
.rv-search .inp { width: 100%; padding-right: 34px; }
.rv-search .x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.rv-search .inp:placeholder-shown + .x { display: none; }
.rv-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rv-chips b { margin-left: 2px; font-variant-numeric: tabular-nums; }
.rv-sep { width: 1px; height: 18px; background: var(--border-strong); margin: 0 2px; }
.rv-count { margin: 0 0 8px; }
.srctag { display: inline-block; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 600; line-height: 1.7; background: var(--bg-muted); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.rv-item { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 12px; text-align: left; width: 100%; background: var(--bg-card); }
.rv-item:hover { background: var(--bg-muted); }
.rv-item.sel { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 22%, transparent); }
.rv-item .t { font-weight: 700; }
.locked { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 14px; color: var(--text-3); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.code { background: #0f1512; color: #cfe8d8; border-radius: 10px; padding: 12px 14px; font-family: 'Pretendard', 'Malgun Gothic', monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre; }
details > summary { cursor: pointer; font-weight: 600; color: var(--text-2); padding: 6px 0; }
.ver-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.ver-row:last-child { border-bottom: 0; }
.usage { height: 8px; background: var(--bg-muted); border-radius: 6px; overflow: hidden; }
.usage i { display: block; height: 100%; background: var(--primary); }
.road { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.road div { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px; }
.pager { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 12px; }
.pager .btn { min-width: 34px; }

/* 모달 · 토스트 */
#modal { position: fixed; inset: 0; z-index: 70; background: rgba(10, 14, 12, .5); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-float); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 22px 24px; }
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text-1); color: var(--bg-card); padding: 11px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow-float); animation: tin .25s ease; max-width: 340px; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* ── 모션 시스템 ─────────────────────────────────────────────
   · 화면 진입(.rise/.enter)은 메뉴 이동·로그인 때만 재생 (상태 갱신으로 다시 그릴 때는 재생하지 않음)
   · 호버·눌림·모달·토스트·상태 점은 항상 부드럽게 전환
   · prefers-reduced-motion 사용자는 모든 모션 제거 */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes rise-s { from { opacity: 0; transform: translateY(6px); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.95); } }
@keyframes growy { from { transform: scaleY(0); } }
@keyframes growx { from { transform: scaleX(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes navIn { from { transform: translateX(-8px); background: var(--bg-muted); box-shadow: inset 0 0 0 var(--primary); } }
@keyframes ringg { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@keyframes bump { 0%, 70%, 100% { transform: scale(1); } 85% { transform: scale(1.18); } }
@keyframes scanline { from { top: 0; } to { top: calc(100% - 3px); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
.rise { animation: rise .6s var(--ease) backwards; animation-delay: var(--d, 0ms); }
.rise-s { animation: rise-s .45s var(--ease) backwards; animation-delay: var(--d, 0ms); }
.fade-s { animation: fadein .5s ease backwards; animation-delay: var(--d, 0ms); }
.enter .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: growy .8s var(--ease) backwards; }
.enter .bar-l, .enter .pt { animation: fadein .5s ease backwards; animation-delay: .6s; }
.enter .draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000); animation: draw 1.1s var(--ease) .15s forwards; }
.enter .rank-bar i, .enter .usage i, .enter .bar-fill, .fresh .bar-fill { transform-origin: left center; animation: growx 1s var(--ease) .25s backwards; }
.side.anim .nav-item.active { animation: navIn .5s var(--ease); }
/* 호버 · 눌림 */
.btn { transition: background .15s, transform .12s var(--ease), box-shadow .2s, border-color .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled), .pill:active, .icon-btn:active, .nav-item:active, .rv-item:active { transform: scale(.97); }
.btn.primary:hover:not(:disabled) { box-shadow: 0 6px 16px color-mix(in srgb, var(--primary) 32%, transparent); }
.card { transition: box-shadow .25s, border-color .25s; }
.card:hover { border-color: var(--border-strong); }
.kpi { transition: border-color .2s, transform .25s var(--ease), box-shadow .25s; }
.kpi:hover { box-shadow: var(--shadow-float); }
.nav-item { transition: background .2s, color .2s, transform .2s var(--ease); }
.icon-btn, .pill { transition: background .2s, transform .12s var(--ease), color .2s; }
.icon-btn:hover { transform: rotate(-8deg) scale(1.06); }
.rv-item { transition: background .2s, border-color .2s, transform .12s var(--ease), box-shadow .25s; }
.tbl td { transition: background .15s; }
.inp { transition: border-color .15s, box-shadow .2s; }
.brand img { transition: transform .45s var(--ease); } .brand:hover img { transform: rotate(-10deg) scale(1.08); }
.photo img { transition: transform .8s var(--ease); } .photo:hover img { transform: scale(1.04); }
details[open] > *:not(summary) { animation: fadein .35s ease; }
@media (hover: hover) and (min-width: 901px) { .nav-item:hover { transform: translateX(3px); } }
/* 상태 점 · 알림 배지 */
button.pill.api.green .dot { animation: ringg 2.2s ease-out infinite; }
.sys-row .st.ok i { animation: ringg 2.6s ease-out infinite; }
.nav-item .cnt { animation: bump 2.6s ease-in-out infinite; }
/* 검사 진행 중 */
.photo.scanning::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, transparent, #fff 20%, #fff 80%, transparent); box-shadow: 0 0 10px 2px #fff, 0 0 26px 8px rgba(80, 220, 170, .75), 0 -18px 28px 4px rgba(80, 220, 170, .28); animation: scanline 1.1s ease-in-out infinite alternate; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: inline-block; animation: spin .7s linear infinite; flex: none; }
.skel { height: 14px; border-radius: 7px; margin-top: 12px; background: linear-gradient(90deg, var(--bg-muted) 25%, var(--bg-hover) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.skel.w60 { width: 60%; } .skel.w80 { width: 80%; }
.fresh > * { animation: pop .5s var(--ease) backwards; } .fresh > :nth-child(2) { animation-delay: .06s; } .fresh > :nth-child(n+3) { animation-delay: .12s; }
/* 모달 · 토스트 · 테마 전환 */
#modal { animation: fadein .2s ease; } .modal-card { animation: pop .3s var(--ease); }
#modal.closing { opacity: 0; pointer-events: none; transition: opacity .15s; } #modal.closing .modal-card { transform: scale(.97); transition: transform .15s; }
.toast.out { animation: toast-out .25s ease forwards; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .4s; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* 공통 페이지 헤더 · 차트 툴팁 · 표로 보기 · 더보기 시트 · 간격 유틸 */

/* 서버 저장소 파일 관리자(팝업) */

.fm-card:hover { border-color: var(--primary); } .fm-card.sel { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 14%, transparent); }

@media (max-width: 640px) { .fm-main { grid-template-columns: 1fr; } .fm-side { display: none; } .fm-row { grid-template-columns: 26px 46px 1fr 70px; } .fm-row .fm-dt { display: none; } .modal-card.fmc { height: 92vh; } }

/* 이미지 확대 뷰어 */
.zoomable { cursor: zoom-in; }

.modal-card.wide { max-width: 900px; }
.vz { position: relative; overflow: hidden; border-radius: 12px; background: #0f1512; border: 1px solid var(--border); aspect-ratio: 475 / 350; max-width: calc(68vh * 475 / 350); margin: 0 auto; touch-action: none; cursor: zoom-in; user-select: none; }

/* 이상 의심 영역 표시(박스) — 모든 역할에 공통, 켜기/끄기 가능 */

/* UI 개선 패치 — 차트 보조선 · 목록 · 빈 상태 · 단계 안내 */

  .btn { min-height: 42px; } .btn.sm { min-height: 38px; padding: 6px 14px; } button.pill { min-height: 36px; padding: 6px 14px; } .icon-btn { width: 40px; height: 40px; }

}
/* 환경별 UI 데모 뷰어 (기본 진입 화면) */

.vw-seg button { padding: 6px 13px; border-radius: 8px; font-weight: 600; color: var(--text-3); }
.vw-seg button.on { background: var(--bg-card); color: var(--text-1); box-shadow: var(--shadow); }
.vw-stage { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
.vw-row { display: flex; gap: 28px; align-items: center; transform-origin: center center; }
.vw-dev { flex: none; background: #1b1f1d; padding: 10px; border-radius: 18px; box-shadow: var(--shadow-float); }
.vw-dev.phone { padding: 12px 8px; border-radius: 40px; }
.vw-dev iframe { display: block; border: 0; background: var(--bg-app); border-radius: 10px; }
.vw-dev.phone iframe { border-radius: 28px; }
.vw-cap { color: var(--text-3); font-size: 12.5px; text-align: center; margin-top: 8px; }
@media (max-width: 440px) { .brand-t { display: none; } .topbar { padding: 0 10px; } .icon-btn { width: 38px !important; } }
@media (max-width: 700px) { .qrow { display: grid; grid-template-columns: 84px 1fr auto; grid-template-areas: "t i a" "t r r"; align-items: center; row-gap: 4px; } .qrow .photo { grid-area: t; } .qrow .qinfo { grid-area: i; } .qrow .qact { grid-area: a; } .qrow .qres { grid-area: r; justify-content: flex-start; } .lbl-s { display: inline; } .lbl-f { display: none; } .sub-hint { display: none; } svg .ct { font-size: 14px; } .nav-item.sec { display: none; } .nav-more { display: flex; } }
@media (max-width: 520px) { .api-name { display: none; } .rank-row { grid-template-columns: 18px 72px 1fr 58px; } .topbar { gap: 6px; } .main { padding: 14px 12px 20px; } .rv-list { max-height: 360px; } }

/* ═══════════════════════════════════════════════════════════════════════════
   수납형 왼쪽 메뉴 (데스크톱 901px~) — 평소엔 아이콘만, 마우스를 올리거나 키보드로 이동하면 펼쳐짐.
   · 펼쳐질 때 본문을 옆으로 살짝 밀면서 그 공간으로 확장된다(본문 폭이 줄어듦).
   · 좁은 화면(≤900px)은 기존 하단 탭바 그대로.
   ═══════════════════════════════════════════════════════════════════════════ */
@media (min-width: 901px) {
  .side { width: 72px; padding: 18px 12px; overflow-x: hidden; white-space: nowrap; transition: width .24s var(--ease) .05s; }
  .main { min-width: 0; }
  .main-inner { max-width: 1120px; }
  .side.open { width: 232px; transition-delay: .06s; }
  /* 메뉴 라벨: 접힘 → 폭 0 · 투명, 펼침 → 표시 */
  .nav-item > span:not(.cnt):not(.lk) { max-width: 0; opacity: 0; overflow: hidden; transition: max-width .24s var(--ease) .05s, opacity .18s ease; }
  .side.open .nav-item > span:not(.cnt):not(.lk) { max-width: 160px; opacity: 1; transition-delay: .09s; }
  /* 접힌 상태: 알림 숫자 → 작은 점, 잠금 아이콘 숨김 */
  .side:not(.open) .nav-item .cnt { position: absolute; top: 7px; right: 9px; margin: 0; width: 9px; height: 9px; min-width: 0; padding: 0; font-size: 0; border-radius: 50%; animation: none; box-shadow: 0 0 0 2px var(--bg-card); }
  .side:not(.open) .nav-item .lk { display: none; }
  /* 접힌 상태: 하단 블록은 아이콘/점만 */
  .side:not(.open) .perm,
  .side:not(.open) .demo-reset,
  .side:not(.open) .sys-card .sc-t,
  .side:not(.open) .prof-n,
  .side:not(.open) .prof .btn { display: none; }
  .side:not(.open) .sys-card { padding: 10px 0; }
  .side:not(.open) .sys-row { font-size: 0; min-height: 17px; justify-content: center; line-height: 1; }
  .side:not(.open) .sys-row .st { font-size: 0; }
  .side:not(.open) .prof { padding: 6px 0; background: none; }
  .side:not(.open) .prof-top { justify-content: center; }
  .side-foot { overflow: hidden; }
  .nav-item:hover { transform: none; }
  .side.no-tr, .side.no-tr * { transition: none !important; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   v4/v6 디자인 시스템 레이어 (demo2.html) — Dribbble "Electronics QA Dashboard" 톤
   (연보라 바깥 배경 · 둥근 흰 프레임 · 초록 포인트 · 얇은 테두리 카드 · 8개 화면 통일)
   ═══════════════════════════════════════════════════════════════════════════ */
:root, html[data-theme="light"] {
  --bg-app: #b9c3de; --bg-card: #ffffff; --bg-muted: #f3f5f8; --bg-hover: #eaedf3; --bg-input: #ffffff;
  --bg-board: #f2f4f8; --bg-subtle: #f8f9fb;
  --border: #e6e9ef; --border-strong: #cfd6e1;
  --text-1: #111827; --text-2: #374151; --text-3: #647082;
  --primary: #2e8b3d; --primary-hover: #247331; --primary-fg: #ffffff;
  --primary-soft: rgba(46, 139, 61, .10);
  --danger: #d92d2d; --danger-hover: #b82323;
  --good: #1f7a2e; --warn: #946200; --bad: #d92d2d;
  --b-green-bg: #e3f3e6; --b-green-fg: #1d702a;
  --b-orange-bg: #fef3d0; --b-orange-fg: #8c5a00;
  --b-red-bg: #fde6e6; --b-red-fg: #c22828;
  --b-gray-bg: #eef1f5; --b-gray-fg: #4b5563;
  --shadow: 0 1px 2px rgba(17, 24, 39, .04);
  --shadow-sm: 0 4px 12px -4px rgba(17, 24, 39, .08);
  --shadow-float: 0 18px 44px -10px rgba(30, 41, 80, .32);
  --bar-normal: #2e8b3d; --bar-normal-soft: #9ed3a6; --bar-defect: #e5484d; --bar-pending: #f0ad38;
  --role-insp: #2f6fcf;
  --frame: #ffffff; --rail-active-bg: #e4f2e5; --rail-active-fg: #1f7a2e;
}
html[data-theme="dark"] {
  --bg-app: #0b0f18; --bg-card: #141b28; --bg-muted: #1b2434; --bg-hover: #232e42; --bg-input: #101622;
  --bg-board: #0e1420; --bg-subtle: #182030;
  --border: #242f42; --border-strong: #374660;
  --text-1: #f2f5fa; --text-2: #cfd7e5; --text-3: #8fa0b8;
  --primary: #4cb85e; --primary-hover: #61c972; --primary-fg: #071409;
  --primary-soft: rgba(76, 184, 94, .16);
  --danger: #ef6b69; --danger-hover: #f58583;
  --good: #6fd484; --warn: #f2c05c; --bad: #ff8583;
  --b-green-bg: rgba(111, 212, 132, .15); --b-green-fg: #82de95;
  --b-orange-bg: rgba(242, 192, 92, .16); --b-orange-fg: #f5ca72;
  --b-red-bg: rgba(255, 133, 131, .16); --b-red-fg: #ffa09e;
  --b-gray-bg: #222c3f; --b-gray-fg: #bcc8dc;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-sm: 0 6px 16px -6px rgba(0, 0, 0, .45);
  --shadow-float: 0 22px 54px rgba(0, 0, 0, .6);
  --bar-normal: #4cb85e; --bar-normal-soft: rgba(92, 206, 110, .44); --bar-defect: #ff7a78; --bar-pending: #f2ba4d;
  --role-insp: #86b4ff;
  --frame: #121824; --rail-active-bg: rgba(111, 212, 132, .16); --rail-active-fg: #82de95;
}

/* ── 포커스 접근성 · 기본 보정 ──────────────────────────────────────────── */
button:focus-visible, [tabindex]:focus-visible, a:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}
select.inp option { background: var(--bg-card); color: var(--text-1); }
code {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88em;
  padding: 1px 6px; border-radius: 5px; background: var(--bg-muted); border: 1px solid var(--border);
  color: var(--text-2); overflow-wrap: anywhere;
}
.code code { padding: 0; border: 0; background: none; color: inherit; }
.code { border: 1px solid var(--border); max-width: 100%; }
.fm-crumbs button:hover, .fm-side button:hover, .fm-side button.on { color: var(--text-1); }
.fm-err { color: var(--bad); }

/* ── 공통 부품 ──────────────────────────────────────────────────────────── */
.card {
  background: var(--bg-card); color: var(--text-1); border-radius: 14px; box-shadow: var(--shadow);
  border: 1px solid var(--border); padding: 18px 20px; min-width: 0;
}
.card + .card { margin-top: 16px; }
.card:hover { border-color: var(--border); }
.sub-card {
  background: var(--bg-subtle); color: var(--text-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
}
.sub-card + .sub-card { margin-top: 10px; }
.card-title {
  font-size: 14.5px; font-weight: 700; margin-bottom: 14px; letter-spacing: -.015em;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-1);
}
.card-title > .ic { color: var(--primary); }
.legend-row { color: var(--text-1); }
.shell, .main, .modal-card { color: var(--text-1); }
.card-sub { font-size: 12.5px; color: var(--text-3); margin: -8px 0 12px; }
.page-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; color: var(--text-1); }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 10px; line-height: 1.5; }
.pill.lg { font-size: 12.5px; padding: 4px 12px; }
.pill.role-admin, .pill.role-insp { font-weight: 700; }
.pill.role-admin { background: var(--primary); }
.pill.on, .chip.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn { border-radius: 9px; font-weight: 600; padding: 8px 15px; font-size: 13.5px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); box-shadow: none; }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 26%, transparent); }
.btn.outline { background: var(--bg-card); border-color: var(--border-strong); color: var(--text-1); }
.btn.outline:hover:not(:disabled) { background: var(--bg-muted); border-color: var(--border-strong); }
.btn.ghost { background: transparent; color: var(--text-2); padding: 5px 10px; font-size: 12.5px; }
.btn.ghost:hover:not(:disabled) { background: var(--bg-muted); color: var(--text-1); }
.btn.g { background: var(--bg-card); color: var(--primary); border: 1px solid var(--primary); }
.btn.g:hover:not(:disabled) { background: var(--primary-soft); }
.btn.r { background: var(--bg-card); color: var(--bad); border: 1px solid var(--bad); }
.btn.r:hover:not(:disabled) { background: color-mix(in srgb, var(--bad) 10%, var(--bg-card)); }
.btn.sm { border-radius: 8px; padding: 5px 11px; font-size: 12.5px; }
.btn.block { padding: 12px 16px; font-size: 14.5px; border-radius: 10px; }
.inp, select.inp, textarea.inp { border-radius: 9px; font-size: 13.5px; border-color: var(--border-strong); }
.inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
.tbl-wrap { overflow-x: auto; max-width: 100%; border-radius: 10px; }
.tbl th {
  background: var(--bg-muted); font-size: 12px; font-weight: 600; color: var(--text-3);
  padding: 9px 12px; border-bottom: 0;
}
.tbl th:first-child { border-radius: 8px 0 0 8px; }
.tbl th:last-child { border-radius: 0 8px 8px 0; }
.tbl td { padding: 11px 12px; font-size: 13px; color: var(--text-1); border-bottom: 1px solid var(--border); }
.tbl td:first-child { white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click:hover td { background: color-mix(in srgb, var(--primary) 5%, var(--bg-card)); }
.tbl tr.sel td { background: color-mix(in srgb, var(--primary) 9%, var(--bg-card)); }
.rv-item, .qrow, .pcb-card, .steps li, .road div, .more-item, .locked, .drop { border-radius: 12px; }
.rv-item { border-color: var(--border); }
.rv-item.sel { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 5%, var(--bg-card)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 18%, transparent); }
.pcb-card { border: 1px solid var(--border); background: var(--bg-card); transition: border-color .15s, box-shadow .15s; }
.pcb-card:hover { border-color: var(--border-strong); }
.drop { background: var(--bg-subtle); border-color: var(--border-strong); }
.drop:hover { border-color: var(--primary); background: var(--primary-soft); }
.modal-card { border-radius: 18px; }
.role-strip { border-radius: 12px; border-left-width: 4px; }
.role-strip.admin, .role-strip.insp { border-left-color: var(--primary); }
.empty { padding: 32px 14px; font-size: 13.5px; line-height: 1.6; }
.empty.ok { color: var(--good); }
.empty.ok .ic { color: var(--good); opacity: .85; }
.split > *, .grid2 > *, .dash-grid > *, .insp-grid > *, .rv-subgrid > * { min-width: 0; }
.split, .grid2 { gap: 16px; }
.grid2 + .card, .split + .card, .dash-grid + .card, .dash-grid + .dash-grid, .card + .dash-grid, .insp-grid + .card { margin-top: 16px; }

/* ── 바깥 틀 ──────────────────── */
body { background: var(--bg-app); }
/* 화면 전체를 꽉 채우는 배치(여백·둥근 테두리·그림자 없음) */
.shell { background: var(--frame); border-radius: 0; border: 0; box-shadow: none; }
.main { background: var(--frame); padding: 0 0 32px; }
.main-inner { max-width: none; margin: 0; padding: 0 28px; }
.main-inner > .page-head {
  margin: 0 -28px 18px; padding: 15px 28px; border-bottom: 1px solid var(--border);
  align-items: center; gap: 12px 16px; background: var(--frame);
}
.main-inner > .page-head > div:first-child { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.main-inner > .page-head .page-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.main-inner > .page-head .page-sub { font-size: 12.5px; margin: 0; color: var(--text-3); }
.main-inner > .page-head .page-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ── 상단바: 로고 · API 상태 · 알림 · 테마 · 프로필 ──────────────────────── */
.topbar { height: 64px; background: var(--frame); border-bottom: 1px solid var(--border); padding: 0 24px; gap: 12px; }
.brand { font-size: 16.5px; font-weight: 800; letter-spacing: -.02em; }
.top-btn {
  position: relative; flex: none; width: 38px; height: 38px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--bg-card); color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s;
}
.top-btn:hover { background: var(--bg-muted); border-color: var(--border-strong); color: var(--text-1); }
.top-btn .ic { width: 18px; height: 18px; }
.top-btn .bdot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--bar-defect); box-shadow: 0 0 0 2px var(--bg-card); }
.top-prof { display: flex; align-items: center; gap: 9px; padding: 4px 11px 4px 5px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); }
.top-prof .avatar { width: 32px; height: 32px; font-size: 13px; background: var(--primary); }
.tp-n { display: flex; flex-direction: column; line-height: 1.25; text-align: left; }
.tp-n b { font-size: 12.5px; color: var(--text-1); }
.tp-n small { font-size: 11px; color: var(--text-3); }
.shell[data-role="admin"] .topbar, .shell[data-role="inspector"] .topbar { box-shadow: none; }

/* ── 왼쪽 아이콘 막대 (수납형: 평소 아이콘만 · 마우스를 올리면 펼침) ──────── */
.side { background: var(--frame); border-right: 1px solid var(--border); }
.nav-item { background: transparent; color: var(--text-3); border-radius: 10px; font-weight: 600; }
.nav-item:hover { background: var(--bg-muted); color: var(--text-1); }
.nav-item.active { background: var(--rail-active-bg); color: var(--rail-active-fg); box-shadow: none; font-weight: 700; }
.nav-item .cnt { background: #f5b942; color: #4a3200; }
.perm, .sys-card, .prof { background: var(--bg-muted); }
@media (min-width: 901px) {
  .side:not(.open) .nav-item .cnt { box-shadow: 0 0 0 2px var(--frame); }
}
@media (max-width: 900px) {
  .side { border-top: 1px solid var(--border); border-right: 0; }
  .nav-item { background: none; }
  .nav-item.active { background: var(--rail-active-bg); }
  .tp-n { display: none; }
  .top-prof { padding: 3px; border-radius: 50%; }
}

/* ── 세그먼트 기간 칩 ───────────────────────────────────────────────────── */
.seg-pills {
  display: inline-flex; align-items: center; background: var(--bg-muted);
  border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px;
}
.seg-pills button {
  padding: 5px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
  color: var(--text-3); transition: background .15s, color .15s; white-space: nowrap;
}
.seg-pills button:hover { color: var(--text-1); }
.seg-pills button.on { background: var(--bg-card); color: var(--primary); font-weight: 700; box-shadow: var(--shadow); }
.seg-pills.sm button { padding: 3px 9px; font-size: 11.5px; }

/* ── KPI 카드 (대시보드 · 통계 · 데이터 공통) ───────────────────────────── */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 18px; text-align: left; box-shadow: var(--shadow); width: 100%;
  display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 0;
  transition: border-color .18s, transform .18s var(--ease), box-shadow .18s;
}
.kpi:hover { border-color: var(--border); box-shadow: var(--shadow); transform: none; }
.kpi.click { cursor: pointer; }
.kpi.click:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.kpi.warn-card { border-color: color-mix(in srgb, var(--bar-pending) 55%, var(--border)); background: color-mix(in srgb, var(--b-orange-bg) 28%, var(--bg-card)); }
.kpi.warn-card:hover { border-color: var(--warn); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.kpi .l { font-size: 12.5px; font-weight: 600; color: var(--text-3); }
.kpi-ico {
  width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-muted); color: var(--text-2); flex: none;
}
.kpi-ico.g { background: var(--b-green-bg); color: var(--b-green-fg); }
.kpi-ico.r { background: var(--b-red-bg); color: var(--b-red-fg); }
.kpi-ico.o { background: var(--b-orange-bg); color: var(--b-orange-fg); }
.kpi-val { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; width: 100%; }
.kpi .v { font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin-top: 0; color: var(--text-1); }
.kpi .v.good { color: var(--good); }
.kpi .v.bad { color: var(--bad); }
.kpi .v.warn { color: var(--warn); }
.kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-top: 2px; width: 100%; }
.delta {
  display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700;
  padding: 1px 7px; border-radius: 999px; white-space: nowrap;
}
.delta.good { background: var(--b-green-bg); color: var(--b-green-fg); }
.delta.bad { background: var(--b-red-bg); color: var(--b-red-fg); }
.delta.flat { background: var(--b-gray-bg); color: var(--b-gray-fg); }

/* ── 대시보드 개요 레이아웃 ─────────────────────────────────────────────── */
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.dash-grid.bal { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.dash-grid > .card { margin-top: 0; display: flex; flex-direction: column; }
.dash-upd {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3);
  padding: 4px 10px; border-radius: 999px; background: var(--bg-muted);
}
.dash-upd i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block; }
.dash-upd.off i { background: var(--bad); }
.chart-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
.chart-legend .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart-legend .lswatch { width: 14px; height: 2.5px; border-radius: 2px; display: inline-block; }

/* 검토 대기 큐 미리보기 */
.pq-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pq-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; width: 100%; text-align: left;
  border: 1px solid var(--border); border-radius: 11px; background: var(--bg-subtle);
  transition: border-color .15s, background .15s, transform .12s var(--ease);
}
.pq-item:hover { border-color: var(--primary); background: var(--bg-card); transform: translateY(-1px); }
.pq-item .thumb { width: 54px; height: 40px; border-radius: 7px; }
.pq-info { flex: 1; min-width: 0; }
.pq-top { display: flex; align-items: center; gap: 6px; }
.pq-top b { font-size: 13px; color: var(--text-1); }
.pq-sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.pq-right { text-align: right; flex: none; }
.pq-score { font-size: 14px; font-weight: 800; color: var(--bad); line-height: 1.2; }
.pq-go { font-size: 11px; color: var(--primary); font-weight: 600; margin-top: 2px; }

/* PCB 종류별 양품률 */
.yield-list { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.yield-item { display: flex; flex-direction: column; gap: 6px; }
.yield-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.yield-pct { font-size: 18px; font-weight: 800; color: var(--good); letter-spacing: -.02em; }
.yield-pct.warn { color: var(--warn); }
.yield-bar { height: 10px; border-radius: 999px; background: var(--bg-muted); overflow: hidden; display: flex; gap: 1px; }
.yield-bar i { display: block; height: 100%; transform-origin: left center; }
.yield-bar i.n { background: var(--bar-normal); }
.yield-bar i.d { background: var(--bar-defect); }
.yield-bar i.p { background: var(--bar-pending); }
.enter .yield-bar i { animation: growx .9s var(--ease) .2s backwards; }
.yield-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); }
.yield-foot {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
}
.yield-stat { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; }
.yield-stat small { display: block; font-size: 11.5px; color: var(--text-3); }
.yield-stat b { display: block; font-size: 15px; font-weight: 700; color: var(--text-1); margin-top: 2px; }

/* 시스템 상태 패널 */
.sys-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; flex: 1; }
.sys-tile {
  border: 1px solid var(--border); border-radius: 11px; padding: 12px 13px; background: var(--bg-subtle);
  display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0;
  transition: border-color .15s, background .15s;
}
button.sys-tile:hover { border-color: var(--primary); background: var(--bg-card); }
.sys-tile-hd { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sys-tile-l { font-size: 12px; font-weight: 600; color: var(--text-3); display: inline-flex; align-items: center; gap: 5px; }
.sys-tile-l .ic { width: 14px; height: 14px; color: var(--text-3); }
.sys-tile-v { font-size: 14px; font-weight: 700; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sys-tile-s { font-size: 11.5px; color: var(--text-3); }
.st-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; }
.st-dot i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: currentColor; }
.st-dot.ok { color: var(--good); }
.st-dot.off { color: var(--bad); }

/* ── PCB 검사 2열 워크스페이스 ──────────────────────────────────────────── */
.insp-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
.insp-grid > .card { margin-top: 0; }
.insp-cfg {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border);
  margin-bottom: 16px;
}

/* ── 검사 관리: 불량 검토 작업대 통합 (기존 대시보드 db* 부품 이관) ───────── */
.split.rv { grid-template-columns: minmax(260px, 310px) minmax(0, 1fr); gap: 16px; align-items: start; }
.rv-list { max-height: 760px; }
.rv-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border);
}
.rv-bar-id { font-size: 17px; font-weight: 800; letter-spacing: -.015em; }
.rv-bar-sp { flex: 1; }
.db-st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.db-st i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.db-st.bad { color: var(--bad); } .db-st.ok { color: var(--good); } .db-st.wait { color: var(--warn); }
.db-board {
  position: relative; background: var(--bg-board); border: 1px solid var(--border); border-radius: 14px;
  min-height: 360px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 26px 248px 26px 64px;
}
.db-wrap { position: relative; width: min(100%, 500px); aspect-ratio: 475 / 350; }
.db-img {
  position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden;
  box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .42); background: #0f1512;
}
.db-in { position: absolute; inset: 0; transition: transform .25s var(--ease); transform-origin: 50% 50%; }
.db-in img { width: 100%; height: 100%; object-fit: cover; display: block; }
.db-dot {
  position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 0; padding: 0;
  cursor: pointer; background: #fff; box-shadow: 0 0 0 4px rgba(255, 255, 255, .45), 0 0 14px 6px rgba(255, 255, 255, .55);
  z-index: 3; transition: transform .15s var(--ease);
}
.db-dot:hover { transform: scale(1.12); }
.db-dot.c1 { background: #ef5b5b; box-shadow: 0 0 0 4px rgba(239, 91, 91, .35), 0 0 14px 6px rgba(239, 91, 91, .55); }
.db-dot.c2 { background: #f5c242; box-shadow: 0 0 0 4px rgba(245, 194, 66, .4), 0 0 14px 6px rgba(245, 194, 66, .6); }
.db-dot.sel { width: 24px; height: 24px; margin: -12px 0 0 -12px; outline: 2.5px solid #fff; }
.db-dot:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
.db-call {
  position: absolute; z-index: 4; transform: translate(-110%, -155%);
  background: var(--bg-card); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--border));
  font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 6px; white-space: nowrap;
  box-shadow: 0 6px 18px -6px rgba(0, 0, 0, .38); pointer-events: none;
}
.db-call::after {
  content: ''; position: absolute; left: 100%; top: 100%; width: 20px; height: 1.5px;
  background: var(--bad); transform-origin: 0 0; transform: rotate(38deg);
}
.db-call.flip-x { transform: translate(14%, -155%); }
.db-call.flip-x::after { left: auto; right: 100%; transform-origin: 100% 0; transform: rotate(-38deg); }
.db-call.flip-y { transform: translate(-110%, 55%); }
.db-call.flip-y::after { top: auto; bottom: 100%; transform-origin: 0 100%; transform: rotate(-38deg); }
.db-call.flip-x.flip-y { transform: translate(14%, 55%); }
.db-call.flip-x.flip-y::after { left: auto; right: 100%; top: auto; bottom: 100%; transform-origin: 100% 100%; transform: rotate(38deg); }
.mk-off .db-dot, .mk-off .db-call { display: none; }
.db-list {
  position: absolute; top: 14px; right: 14px; width: 224px; max-height: 220px; overflow-y: auto;
  background: color-mix(in srgb, var(--bg-card) 94%, transparent); backdrop-filter: blur(6px);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-sm);
  padding: 8px; z-index: 5; display: flex; flex-direction: column; gap: 2px;
}
.db-list-hd { font-size: 11px; font-weight: 700; color: var(--text-3); padding: 2px 8px 5px; letter-spacing: .01em; }
.db-list button {
  display: flex; align-items: center; gap: 8px; text-align: left; font-size: 12px;
  padding: 7px 9px; border-radius: 7px; color: var(--text-1); width: 100%;
}
.db-list button:hover { background: var(--bg-muted); }
.db-list button.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.db-list button i { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); flex: none; }
.db-list .none { font-size: 12px; color: var(--text-3); padding: 6px 8px; }
.db-zoom {
  position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 5;
}
.db-zoom button {
  width: 34px; height: 34px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center; color: var(--text-2);
  box-shadow: var(--shadow-sm); font-size: 11px; font-weight: 700;
}
.db-zoom button:hover:not(:disabled) { background: var(--bg-muted); color: var(--text-1); }
.db-zoom button:disabled { opacity: .45; cursor: not-allowed; }
.db-zoom .ic { width: 16px; height: 16px; }
.rv-canvas-tools {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;
}
.rv-subgrid {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px;
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); align-items: start;
}
.rv-sec-t { font-size: 13.5px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; color: var(--text-1); }
.db-kv { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.db-kv > div { padding: 9px 13px; font-size: 12.5px; line-height: 1.45; border-bottom: 1px solid var(--border); }
.db-kv > div:nth-child(odd) { background: var(--bg-subtle); }
.db-kv > div:last-child { border-bottom: 0; }
.db-kv b { font-weight: 700; }
.db-kv .k { color: var(--text-3); font-weight: 600; margin-right: 6px; }
.db-kv .red { color: var(--bad); font-weight: 700; }
.db-zimg {
  margin-top: 8px; height: 126px; border-radius: 8px; background-color: #0f1512;
  background-repeat: no-repeat; border: 1px solid var(--border); cursor: zoom-in;
}
.sev { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.sev i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.rv-act-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rv-act-btns .btn { padding: 11px 14px; font-size: 14px; }
.rv-ev { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ── 이력 필터 바 ───────────────────────────────────────────────────────── */
.hist-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.hist-bar .inp { width: auto; max-width: 100%; }

/* ── 반응형 (태블릿 · 모바일 390px 가로 스크롤 0건 보장) ─────────────────── */
@media (max-width: 1160px) {
  .dash-grid, .dash-grid.bal, .insp-grid { grid-template-columns: 1fr; }
  .rv-subgrid { grid-template-columns: 1fr; }
  .db-board { padding: 24px 20px; }
}
@media (max-width: 1100px) {
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .split.rv { grid-template-columns: 1fr; }
  .rv-list { max-height: 280px; }
}
@media (max-width: 700px) {
  .rv-sep { display: none; }
  .main { padding: 0 0 24px; }
  .main-inner { padding: 0 14px; }
  .main-inner > .page-head { margin: 0 -14px 14px; padding: 12px 14px; }
  .card { padding: 15px 14px; }
  .kpi-grid { gap: 10px; }
  .kpi { padding: 13px 14px; }
  .kpi .v { font-size: 22px; }
  .yield-foot { grid-template-columns: 1fr; }
  .sys-grid { grid-template-columns: 1fr; }
  .db-board { flex-direction: column; align-items: stretch; padding: 12px; min-height: 0; gap: 10px; }
  .db-list { position: static; width: auto; max-height: none; order: 2; }
  .db-wrap { order: 1; width: 100%; }
  .db-zoom { position: static; order: 3; flex-direction: row; }
  .db-call { display: none; }
  .hist-bar .inp { flex: 1 1 135px; }
  .hist-bar .btn { margin-left: 0 !important; }
  .rv-act-btns { grid-template-columns: 1fr; }
}
@media (max-width: 440px) {
  .topbar { padding: 0 10px; gap: 6px; }
  .top-btn { width: 34px; height: 34px; }
  .top-prof .avatar { width: 30px; height: 30px; }
  .kpi-grid { gap: 8px; }
  .kpi { padding: 11px 12px; }
  .kpi .v { font-size: 20px; }
  .seg-pills button { padding: 4px 8px; font-size: 12px; }
}

/**
 * 시드 기반 의사난수 생성기(mulberry32) — 새로고침해도 동일한 데모 데이터를 보장한다.
 * @param {number} seed 시드값
 * @returns {function(): number} 0~1 난수 함수
 */
function makeRng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

    else if (defect.includes(n)) { score = fixed[n] ?? (n === 52 ? 0.55 : +(0.66 + rng() * 0.26).toFixed(2)); final = 'DEFECT'; }
    else if (rescued.includes(n)) { score = +(0.61 + rng() * 0.13).toFixed(2); final = 'NORMAL'; }
    else { score = fixed[n] ?? +(0.08 + rng() * 0.38).toFixed(2); final = 'NORMAL'; }

/**

 * @param {object} r 검사 레코드
 * @returns {'PENDING'|'NORMAL'|'DEFECT'} 검토 대기 / 정상 확정 / 불량 확정
 */
function finalState(r) { return r.final === null ? 'PENDING' : r.final; }

/**
 * 대시보드 KPI 4종과 AI-검사원 일치율을 집계한다.
 * @returns {{total:number, normal:number, defect:number, pending:number, match:number}} 집계값 (match: 일치율 %)
 */
function getStats() {
  const l = S.inspections;
  const normal = l.filter(r => r.final === 'NORMAL').length;
  const defect = l.filter(r => r.final === 'DEFECT').length;
  const pending = l.filter(r => r.final === null).length;
  const confirmed = l.filter(r => r.final !== null);
  const same = confirmed.filter(r => (r.ai === 'ANOMALY') === (r.final === 'DEFECT')).length;
  return { total: l.length, normal, defect, pending, match: confirmed.length ? +(same / confirmed.length * 100).toFixed(1) : 0 };
}

function finalBadge(r) {

/**
 * 시각(ms)을 'HH:MM' 문자열로 변환한다.
 * @param {number} ms 에폭 밀리초
 * @returns {string} 시:분
 */
function hhmm(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

/**
 * 시각(ms)을 'MM-DD HH:MM' 문자열로 변환한다.
 * @param {number} ms 에폭 밀리초
 * @returns {string} 월-일 시:분
 */
function mdhm(ms) { const d = new Date(ms); return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + hhmm(ms); }

 * 이상 영역 좌표를 이용해 확대 썸네일 스타일을 만든다 (목록용).
 * @param {object} r 검사 레코드
 * @returns {string} inline style 문자열
 */
function thumbStyle(r) {
  // 이상 의심 건은 의심 위치를 확대해 보여 주고, 정상 건은 전체를 보여 준다.
  const zoom = r.ai === 'ANOMALY' ? 170 : 115;
  return `background-image:url('${r.img}');background-size:${zoom}%;background-position:${r.ai === 'ANOMALY' ? `${r.spot.x}% ${r.spot.y}%` : '50% 50%'};`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   3. 공통 UI — 토스트 · 모달 · 테마 · 라우팅
   ═══════════════════════════════════════════════════════════════════════════ */
/**
 * 토스트 알림을 3초간 표시한다.
 * @param {string} msg 표시할 메시지
 */
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 2750);
}

/* ── 모션 헬퍼 ── */
/** 모션 감소 설정(prefers-reduced-motion) 여부. 켜져 있으면 JS 모션도 건너뛴다. */
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
/** easeOutCubic 보간 (0~1 → 0~1). */
const easeOut = t => 1 - Math.pow(1 - t, 3);

/**
 * 숫자 텍스트(예: 120, 9.0%, 18.4 GB, 1,200건)를 0에서 목표값까지 세어 올린다.
 * 숫자로 시작하지 않는 값(버전·문장 등)은 그대로 둔다.
 * @param {HTMLElement} el 대상 요소 (텍스트만 가진 요소)
 * @param {number} [dur] 지속 시간(ms)
 */
function countUp(el, dur = 900) {
  const txt = el.textContent.trim(), m = txt.match(/^(-?[\d,]*\.?\d+)(\s?[^\d.,]{0,4})$/);
  if (!m) return;
  const target = parseFloat(m[1].replace(/,/g, '')), dec = (m[1].split('.')[1] || '').length, comma = m[1].includes(','), suf = m[2];
  const fmt = v => (comma ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec)) + suf;
  const t0 = performance.now(); el.textContent = fmt(0);
  (function step(now) { const p = Math.min(1, (now - t0) / dur); el.textContent = fmt(target * easeOut(p)); if (p < 1) requestAnimationFrame(step); })(t0);
}

/**
 * 도넛 차트 호를 중심에서 펼치듯 그린다 (stroke-dasharray 보간).
 * @param {SVGCircleElement[]} arcs data-len / data-off / data-c 속성을 가진 호
 */
function sweepDonut(arcs) {
  const t0 = performance.now(), dur = 1100;
  (function step(now) {
    const k = easeOut(Math.min(1, (now - t0) / dur));
    arcs.forEach(a => { const len = +a.dataset.len * k, C = +a.dataset.c; a.setAttribute('stroke-dasharray', `${len} ${C - len}`); a.setAttribute('stroke-dashoffset', -(+a.dataset.off) * k); });
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/**
 * 렌더 직후 진입 모션을 재생한다.
 * - U.anim: 메뉴 이동·로그인 같은 "화면 진입" → 카드 순차 등장, 차트 그리기, 숫자 세기, 탭 강조
 * - U.fresh: 검사 결과 갱신 → 결과 숫자만 세어 올림 (다른 영역은 건드리지 않음)
 * 단순 상태 갱신(필터·토글 등)은 재생하지 않아 깜박임을 막는다.
 * @param {HTMLElement} app #app 루트
 */
function playEnter(app) {
  const full = U.anim, fresh = U.fresh; U.anim = false; U.fresh = false;
  if (REDUCED || (!full && !fresh)) return;
  if (fresh) app.querySelectorAll('.fresh .score-big').forEach(el => countUp(el, 800));
  if (!full) return;
  const side = app.querySelector('.side'); if (side) side.classList.add('anim');
  const inner = app.querySelector('.main-inner');
  if (inner) {
    inner.classList.add('enter');
    inner.querySelectorAll(':scope > :not(.kpi-grid):not(.split):not(.grid2):not(.dash-grid):not(.insp-grid), :scope > .kpi-grid > *, :scope > .split > *, :scope > .grid2 > *, :scope > .dash-grid > *, :scope > .insp-grid > *')
      .forEach((el, i) => { el.style.setProperty('--d', Math.min(i, 10) * 65 + 'ms'); el.classList.add('rise'); });
    inner.querySelectorAll('.tbl tbody tr, .ver-row, .rv-item, .rank-row, .legend-row, .road > div, .pq-item, .sys-tile').forEach(el => {
      const i = Array.prototype.indexOf.call(el.parentElement.children, el);
      el.style.setProperty('--d', 220 + Math.min(i, 10) * 38 + 'ms'); el.classList.add(el.tagName === 'TR' ? 'fade-s' : 'rise-s');
    });
    inner.querySelectorAll('.draw').forEach(p => p.style.setProperty('--len', Math.ceil(p.getTotalLength ? p.getTotalLength() : 1000)));
    sweepDonut([...inner.querySelectorAll('circle[data-len]')]);
    inner.querySelectorAll('.kpi .v, .score-big, .rs-i b').forEach(el => countUp(el));
  } else { const card = app.querySelector('.login-card'); if (card) card.classList.add('rise'); }
}

/**
 * 모달을 연다.
 * @param {string} html 모달 카드 내부 HTML
 */
function openModal(html) {
  clearTimeout(modalTimer);
  const m = document.getElementById('modal'); m.classList.remove('closing'); m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${html}</div>`; m.classList.remove('hidden');
  m.onclick = e => { if (e.target === m) closeModal(); };
}

/** 닫기 페이드 타이머 (닫는 중에 새 모달이 열리면 취소해 내용이 지워지지 않게 한다). */
let modalTimer = 0;
/** 모달을 닫는다 (0.15초 페이드 후 제거). */
function closeModal() {
  const m = document.getElementById('modal'); if (m.classList.contains('hidden')) return;
  if (REDUCED) { m.classList.add('hidden'); m.innerHTML = ''; return; }
  m.classList.add('closing'); clearTimeout(modalTimer);
  modalTimer = setTimeout(() => { m.classList.add('hidden'); m.classList.remove('closing'); m.innerHTML = ''; }, 150);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/**
 * 라이트/다크 테마를 적용한다.
 * @param {'light'|'dark'} t 테마명
 */
function applyTheme(t) { S.theme = t; document.documentElement.setAttribute('data-theme', t); }

/** 테마를 토글하고 화면을 다시 그린다 (View Transition 지원 브라우저는 부드럽게 교차 전환). */
function toggleTheme() {
  const swap = () => { applyTheme(S.theme === 'light' ? 'dark' : 'light'); render(); };
  if (document.startViewTransition && !REDUCED) document.startViewTransition(swap); else swap();
}
